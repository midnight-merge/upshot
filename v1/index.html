<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>upshot - export</title>
<meta name="robots" content="noindex">
<style>
/* the card commits to one look in both themes - it is an object, not a document */
:root{
  --card:#12131A;
  --ink:#F7F7F4;
  --dim:#B4B6C2;
  --faint:#8E91A6;
  --accent:#C8FF3D;
  --hair:rgba(247,247,244,.12);
  /* the platform's own faces - nothing to download, and none of the
     Google-Fonts pairings that read as templated */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--card);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  /* export content is arbitrary AI text with no length guarantee - never let
     one long unbroken token overflow the card and trigger mobile auto-zoom */
  overflow-wrap:anywhere;
  /* Trailing space at the end of the document. Chrome on iOS stops the scroll
     with the last of the page still under its bottom toolbar - you can drag
     past it, but it rubber-bands straight back. Ordinary sites do not show
     this because they have slack down there; this card ended 30px after the
     credit line. Static, because the moment the two viewport heights diverge
     is not one that fires any event to measure at. */
  padding-bottom:160px;

  /* an ordinary scrolling document - no viewport lock, no nested scrollport,
     and deliberately no min-height:100vh. On iOS, 100vh is the LARGE viewport
     (the height with the address bar retracted), so it stretches the body
     past the visible area and even a two-line card scrolls. Nothing needs it:
     the body's background propagates to the canvas, so the page paints edge
     to edge however short the card is. */
}

.sheet{
  width:100%;
  max-width:430px;
  background:var(--card);
  padding:40px 26px 30px;
}

/* head - brand on the homepage, the scope line on a card */
.head{padding-bottom:22px}
/* the mark sits in the strip iOS clips, so the scope line clears it */
.head .mark{margin-bottom:34px}
/* a card with no scope line has nothing up top - take the gap with it */
.head:empty{padding-bottom:0}
/* foot - the hairline and spacing live HERE, not on .meta, so the homepage
   (credit only) and a card (signature + credit) open the same way */
.foot{
  margin-top:34px;
  padding-top:18px;
  border-top:1px solid var(--hair);
}
.foot > :first-child{margin-top:0}

/* the page scrolls, not this - ordinary flow */
main > :last-child{margin-bottom:0}

/* ONE header line, used by both the homepage and a card. Only the text
   inside it ever differs - so the header does not change size, weight or
   colour when you go from one to the other. */
.brand{
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.5;
  letter-spacing:.01em;
  color:var(--faint);
}
.brand::after{content:"";display:block;clear:both}

/* the mark: lines of text distilling down to a single point - the upshot.
   Floated, not a flex child, so only the FIRST line clears it - wrapped
   lines run back to the full width instead of the whole block indenting. */
.logo{
  float:left;
  width:12px;
  height:10px;
  margin:4px 8px 0 0;   /* top nudge sits it on the first line */
  fill:var(--accent);
}

h1{
  font-weight:700;
  font-size:35px;
  line-height:1.06;
  letter-spacing:-.032em;
  text-wrap:balance;
  margin:0 0 22px;
}

.verdict{
  font-size:19.5px;
  font-weight:400;
  line-height:1.42;
  letter-spacing:-.008em;
  color:var(--dim);
  margin:0 0 34px;
  padding-left:15px;
  border-left:2px solid var(--accent);
}

p{margin:0 0 15px;font-size:15px;color:var(--dim)}

.points{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.points li{
  display:flex;
  gap:12px;
  font-size:15.5px;
  line-height:1.5;
  color:var(--dim);
}
.points .n{
  color:transparent;
  flex:none;
  width:5px;
  height:5px;
  margin-top:9px;
  border-radius:50%;
  background:var(--accent);
  overflow:hidden;
}
.points strong{font-weight:600;color:var(--ink)}

/* checklist - a real <input type=checkbox> inside a <label>, so it is
   focusable, tappable anywhere along the row, and reaches a screen reader as
   a checkbox. appearance:none only takes the native look away, not the
   semantics. A ticked item goes quiet rather than struck through: the share
   renderer reads each row's own computed colour, so the state costs it
   nothing to reproduce. */
.checks{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.checks label{
  display:flex;
  gap:12px;
  align-items:flex-start;
  cursor:pointer;
  font-size:15.5px;
  line-height:1.5;
  color:var(--dim);
}
.checks input{
  appearance:none;
  -webkit-appearance:none;
  flex:none;
  width:16px;
  height:16px;
  margin:3px 0 0;
  border:1.5px solid var(--faint);
  border-radius:4px;
  background:transparent;
  cursor:pointer;
}
.checks input:checked{background:var(--accent);border-color:var(--accent)}
.checks input:checked + span{color:var(--faint)}
.checks input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* inputs - a checklist row with a number in place of the tick. Same shape for
   the same reason: a control on the left the reader can change, and what it is
   called beside it. The width is fixed rather than fitted to the value, so a
   number growing a digit cannot reflow the label next to it - the share
   renderer measures that label against a width it was told, not one it
   watched. */
.ins{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.ins label{
  display:flex;
  gap:12px;
  align-items:flex-start;
  cursor:pointer;
  font-size:15.5px;
  line-height:1.5;
  color:var(--dim);
}
.ins input{
  appearance:none;
  -webkit-appearance:none;
  flex:none;
  width:72px;
  margin:0;
  padding:1px 7px;
  border:1.5px solid var(--faint);
  border-radius:4px;
  background:transparent;
  color:var(--ink);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  text-align:right;
}
.ins input::-webkit-outer-spin-button,
.ins input::-webkit-inner-spin-button{appearance:none;margin:0}
.ins input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* steps - ordered, so the marker is the number itself rather than a dot. It
   carries the row's font and line-height so the two line boxes are identical
   and the baselines agree without being told to; the canvas renderer leans on
   that too. The digit lives in the markup, not a CSS counter, because the
   share renderer has to be able to read it. */
.steps{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.steps li{
  display:flex;
  gap:12px;
  font-size:15.5px;
  line-height:1.5;
  color:var(--dim);
}
.steps .n{
  flex:none;
  width:20px;
  font-weight:600;
  color:var(--accent);
}

/* facts - a spec sheet, which is what most people actually wanted a table for.
   One line per row, label then value, both in the mono register so a single
   font covers the row and the canvas renderer needs nothing new. */
.facts{margin:0}
.fact{
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.6;
  color:var(--ink);
  padding-bottom:9px;
}
.fact + .fact{border-top:1px solid var(--hair);padding-top:9px}
.fact:last-child{padding-bottom:0}
.fact .fv{margin-left:10px}
.fact .fk{color:var(--faint)}

/* results - a fact the card worked out rather than one it was handed. The
   formula rides in the same row so the number can be checked: a figure a
   reader cannot audit is worse than prose, because arithmetic looks
   objective in a way a sentence does not. Tabular figures keep a recomputed
   value the same width as the one it replaced. */
.calc .fv{font-variant-numeric:tabular-nums}
.calc .fx{margin-left:10px;color:var(--faint)}

/* stats - two to four figures. The number carries the card, so it gets
   headline treatment and the label stays out of its way. */
.stats{
  margin:0;
  display:flex;
  flex-direction:column;
  gap:22px;
}
.stat .sv{
  font-size:34px;
  font-weight:700;
  line-height:1.12;
  letter-spacing:-.03em;
  color:var(--ink);
}
.stat .sl{
  font-size:13px;
  line-height:1.4;
  color:var(--faint);
  margin-top:3px;
}

/* Blocks. The frame never changes - scope line, headline, verdict, signature -
   and up to three of these stack between the verdict and the foot. The label
   reuses the signature's mono register so it reads as a label rather than a
   second headline; the padding and rule are reset because h2 is styled for the
   landing page. Two labelled bullet blocks are what a comparison is. */
.block + .block{margin-top:28px}
.bl{
  font-family:var(--mono);
  font-size:11px;
  font-weight:400;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 13px;
  padding-top:0;
  border-top:0;
}

/* metadata sits at the bottom like a signature, not a footer bar */
.meta{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--faint);
}
.meta .sig{display:flex;flex-direction:column;gap:5px;min-width:0}
/* The renderer measures this line on its own and wraps it against the full
   column width, knowing nothing about the actions taking part of it - so a
   model name long enough to wrap here would add a line the image does not
   draw. Truncating is the visible failure; drifting apart is the silent one. */
.meta .r1{
  line-height:1.5;
  white-space:nowrap;
  overflow:hidden;        /* also contains the floated mark */
  text-overflow:ellipsis;
}
.meta .r2{color:var(--faint)}
/* same mark, scaled to the signature's smaller type */
.meta .logo{width:10px;height:8px;margin:2px 7px 0 0}
.meta .sep{opacity:.5}
.meta .model{color:var(--dim);margin-left:6px}
.meta .by{color:var(--faint)}

footer{
  margin-top:14px;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--faint);
}
footer .frow{display:none}
/* same hairline-to-accent treatment as the share control */
a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--hair)}
a:hover{color:var(--accent);border-bottom-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
footer .how{text-transform:none;letter-spacing:0;font-size:12px;line-height:1.5;text-wrap:pretty}
.cmd{color:var(--accent)}

/* The actions sit on the signature line so they read as part of the card
   rather than a toolbar bolted under it. They must stay SHORTER than the
   signature beside them: the renderer draws .r1 and .r2 and never sees these
   buttons, so any height they add here is height the share image does not
   have. Two icons are 46px, which is also what lets the model line keep the
   rest of the row - the same pair as text labels needed 176px and truncated
   anything longer than "GPT-5". */
.wrap{display:flex;flex-direction:column;align-items:center;width:100%}
.acts{display:flex;gap:6px;flex:none;align-self:flex-start;margin:-6px}
.act{
  display:block;
  width:30px;
  height:30px;
  padding:7px;           /* a 16px glyph in a 30px tap target, and the */
  color:var(--dim);      /* negative margin on .acts keeps the row at 16 */
  background:transparent;
  border:0;
  cursor:pointer;
  flex:none;
}
.act svg{display:block;width:16px;height:16px}
.act:hover{color:var(--accent)}
.act:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-radius:4px}
.act[disabled]{opacity:.45;cursor:default}
/* the confirmation: the glyph itself becomes the tick, in accent */
.act.done{color:var(--accent)}
/* announced rather than drawn - the icon carries the message for everyone who
   can see it, and this carries it for everyone who cannot */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

</style>
</head>
<body>
<!-- ONE shell, used by both the landing page and a rendered card. Only the
     contents of .head / main / .foot are ever replaced - the structure and
     its layout mode never change, so the browser lays out one kind of
     document per load instead of two. -->
<div class="wrap"><div class="sheet" id="sheet">

  <div class="head" id="head">
    <div class="brand">
      <svg class="logo" viewBox="0 0 12 10" aria-hidden="true">
        <rect x="0" y="0" width="12" height="2" rx="1"/>
        <rect x="0" y="4" width="7" height="2" rx="1"/>
        <circle cx="1.5" cy="8.5" r="1.5"/>
      </svg>
      <span>upshot.fyi</span>
    </div>
  </div>

  <!-- Empty on purpose. This document has one job: render whatever is in the
       fragment. It ships no copy of its own, so it is never a tall page that
       shrinks after layout - which is what the landing page used to make every
       card link do. -->
  <main id="main"></main>
  <noscript><p style="padding:0 26px;color:#B4B6C2">An export is drawn in your
    browser from the link itself, so this page needs JavaScript.</p></noscript>

  <div class="foot" id="foot">
    <footer><div class="how">Made by <a href="https://github.com/midnight-merge">Midnight
      Merge</a></div></footer>
  </div>

</div>

</div>

<script>
// AI-authored links sometimes get percent-encoded twice (once by hand per
// our own instructions, once for real when the link is assembled) - decode
// until it stops changing instead of trusting exactly one layer
function decodeAll(v){
  for(var i = 0; i < 4; i++){
    var next;
    try { next = decodeURIComponent(v); } catch(e){ break; }
    if(next === v) break;
    v = next;
  }
  return v;
}

/* The card is a fixed frame - scope line, headline, verdict, signature - with
   up to three blocks stacked in the middle. g= starts a block and labels it;
   the key that follows decides what kind. Blocks come out in the order they
   appear in the URL, so the grammar needs no numbering and no nesting. */
var BLOCK_KEYS = ['p', 'o', 'c', 'f', 'n', 'r', 'i'];
var MAX_BLOCKS = 3;

function parse(hash){
  var out = {blocks: []};
  var current = null;
  var pendingLabel = null;

  hash.replace(/^#/,'').split('&').forEach(function(pair){
    if(!pair) return;
    var i = pair.indexOf('=');
    if(i < 0) return;
    var k = pair.slice(0,i);
    var v = decodeAll(pair.slice(i+1).replace(/\+/g,' '));

    if(k === 'g'){
      // a label always begins a new block, so two of the same kind can sit
      // side by side - which is all a comparison ever was
      pendingLabel = v;
      current = null;
      return;
    }
    if(BLOCK_KEYS.indexOf(k) >= 0){
      if(!current || current.type !== k){
        current = {type: k, label: pendingLabel, items: []};
        pendingLabel = null;
        out.blocks.push(current);
      }
      current.items.push(v);
      return;
    }
    out[k] = v;
  });

  out.blocks = out.blocks.filter(function(b){ return b.items.length; }).slice(0, MAX_BLOCKS);
  // worked out here rather than while drawing, so every reader of a parsed
  // card - the renderer, the share image, copy for AI - sees the same numbers
  computeAll(out.blocks, out.w);
  return out;
}

function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// the mark, same geometry as the homepage's - see .logo
var LOGO = '<svg class="logo" viewBox="0 0 12 10" aria-hidden="true">' +
  '<rect x="0" y="0" width="12" height="2" rx="1"/>' +
  '<rect x="0" y="4" width="7" height="2" rx="1"/>' +
  '<circle cx="1.5" cy="8.5" r="1.5"/></svg>';

/* One 16px grid, stroked in currentColor, so an icon inherits the link
   treatment the rest of the card uses and needs no colour of its own. The
   tick and the cross are the same size as what they replace, so confirming an
   action can never move the row. */
var ICON = (function(){
  var open = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
    'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" ' +
    'aria-hidden="true">';
  return {
    copy:  open + '<path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.5"/>' +
                  '<rect x="5.5" y="5.5" width="9" height="9" rx="1.5"/></svg>',
    share: open + '<path d="M8 10.5V2"/><path d="M5 5l3-3 3 3"/>' +
                  '<path d="M3.5 8.5v4A1.5 1.5 0 0 0 5 14h6a1.5 1.5 0 0 0 1.5-1.5v-4"/></svg>',
    done:  open + '<path d="M3 8.5l3.5 3.5L13 4.5"/></svg>',
    fail:  open + '<path d="M4.5 4.5l7 7"/><path d="M11.5 4.5l-7 7"/></svg>'
  };
})();

/* An icon says what a button does and nothing about what just happened, so
   every action ends by swapping the glyph for a tick or a cross and saying the
   same thing into the live region for anyone not looking at it. Same 16px box
   either way, so the signature row never moves. */
function actionResult(btn, ok, said){
  clearTimeout(btn._revert);
  // captured on first use, so the resting glyph is whatever the markup put
  // there rather than something a caller has to remember to hand over
  if(!btn._icon) btn._icon = btn.innerHTML;
  btn.innerHTML = ok ? ICON.done : ICON.fail;
  btn.classList.toggle('done', ok);
  var live = document.getElementById('said');
  if(live) live.textContent = said;
  btn._revert = setTimeout(function(){
    btn.innerHTML = btn._icon;
    btn.classList.remove('done');
    if(live) live.textContent = '';
  }, 2200);
}

/* The credit line and the Copy button are the same gesture - take this to an
   AI - so one sentence explains both: what the button is for, then how you get
   a card of your own. The instruction has to survive on its own in the share
   image, where there is no button to explain. */
var CREDIT = '<footer><div class="how">Paste it into any AI to dig in. Or make ' +
  'your own - tell yours to <span class="cmd">read upshot.fyi</span> and ' +
  'export this</div></footer>';

/* ---- blocks ----
   A block owns one stretch of the middle and nothing else. Each declares the
   HTML for its items and how the share renderer redraws them in canvas ops -
   two implementations that have to agree, which is what `node test/run.js`
   checks. A block with no measure() still works as a page; it just cannot be
   exported as an image. */

/* ---- expressions ----
   A card can work a number out instead of being told one. What the URL
   carries is a formula, never code: this is a tokeniser and a
   recursive-descent parser over a closed set of operators and named
   functions, so a link can compute and cannot execute. eval() or Function()
   here would hand any stranger's URL the run of the page, on a domain whose
   whole value is that people trust what it opens.

   Everything that goes wrong - unknown name, bad syntax, divide by zero -
   comes back as null and draws as a dash. A number that is not a number must
   never reach the card looking like one. */
var FUNCS = {
  min: Math.min, max: Math.max, abs: Math.abs, sqrt: Math.sqrt,
  pow: Math.pow, floor: Math.floor, ceil: Math.ceil,
  round: function(x, dp){
    var f = Math.pow(10, dp || 0);
    return Math.round(x * f) / f;
  }
};

function tokenize(src){
  var out = [], i = 0;
  while(i < src.length){
    var ch = src.charAt(i);
    if(ch === ' '){ i++; continue; }
    if(ch >= '0' && ch <= '9' || ch === '.'){
      var num = /^[0-9]*\.?[0-9]+/.exec(src.slice(i));
      if(!num) throw 0;
      out.push({t: 'num', v: parseFloat(num[0])});
      i += num[0].length;
      continue;
    }
    if(/[A-Za-z_]/.test(ch)){
      var word = /^[A-Za-z_][A-Za-z0-9_]*/.exec(src.slice(i))[0];
      out.push({t: 'name', v: word});
      i += word.length;
      continue;
    }
    var two = src.substr(i, 2);
    if(two === '<=' || two === '>=' || two === '==' || two === '!='){
      out.push({t: two});
      i += 2;
      continue;
    }
    if('+-*/(),<>?:'.indexOf(ch) >= 0){ out.push({t: ch}); i++; continue; }
    throw 0;
  }
  return out;
}

function parseExpr(tokens){
  var pos = 0;
  var peek = function(){ return tokens[pos] || {t: 'end'}; };
  var eat = function(t){
    if(peek().t !== t) throw 0;
    return tokens[pos++];
  };

  function ternary(){
    var cond = comparison();
    if(peek().t !== '?') return cond;
    eat('?');
    var yes = ternary();
    eat(':');
    return {op: '?', c: cond, a: yes, b: ternary()};
  }
  function comparison(){
    var left = additive();
    var t = peek().t;
    if(t !== '<' && t !== '>' && t !== '<=' && t !== '>=' &&
       t !== '==' && t !== '!=') return left;
    pos++;
    return {op: t, l: left, r: additive()};
  }
  function additive(){
    var left = multiplicative();
    while(peek().t === '+' || peek().t === '-'){
      left = {op: tokens[pos++].t, l: left, r: multiplicative()};
    }
    return left;
  }
  function multiplicative(){
    var left = unary();
    while(peek().t === '*' || peek().t === '/'){
      left = {op: tokens[pos++].t, l: left, r: unary()};
    }
    return left;
  }
  /* A leading + means nothing, which is what lets "+5" and "2*+3" through:
     both are arithmetic a model can reasonably write, and neither is worth
     failing a card over. */
  function unary(){
    if(peek().t === '-'){ pos++; return {op: 'neg', l: unary()}; }
    if(peek().t === '+'){ pos++; return unary(); }
    return primary();
  }
  function primary(){
    var tk = peek();
    if(tk.t === 'num'){ pos++; return {op: 'num', v: tk.v}; }
    if(tk.t === '('){ pos++; var inner = ternary(); eat(')'); return inner; }
    if(tk.t === 'name'){
      pos++;
      if(peek().t !== '(') return {op: 'ref', v: tk.v};
      eat('(');
      var args = [];
      if(peek().t !== ')'){
        args.push(ternary());
        while(peek().t === ','){ pos++; args.push(ternary()); }
      }
      eat(')');
      return {op: 'call', v: tk.v, args: args};
    }
    throw 0;
  }

  var tree = ternary();
  if(pos !== tokens.length) throw 0;   // trailing junk is a broken formula
  return tree;
}

/* own-property lookups only, on both sides: a name in a URL must not be able
   to reach constructor, __proto__ or anything else the prototype chain would
   otherwise answer for */
function evalNode(node, env){
  switch(node.op){
    case 'num': return node.v;
    case 'ref':
      if(!Object.prototype.hasOwnProperty.call(env, node.v)) throw 0;
      return env[node.v];
    case 'neg': return -evalNode(node.l, env);
    case 'call':
      if(!Object.prototype.hasOwnProperty.call(FUNCS, node.v)) throw 0;
      return FUNCS[node.v].apply(null, node.args.map(function(a){
        return evalNode(a, env);
      }));
    case '?': return evalNode(node.c, env) ? evalNode(node.a, env)
                                           : evalNode(node.b, env);
  }
  var l = evalNode(node.l, env), r = evalNode(node.r, env);
  switch(node.op){
    case '+':  return l + r;
    case '-':  return l - r;
    case '*':  return l * r;
    case '/':  return l / r;
    case '<':  return l <  r ? 1 : 0;
    case '>':  return l >  r ? 1 : 0;
    case '<=': return l <= r ? 1 : 0;
    case '>=': return l >= r ? 1 : 0;
    case '==': return l === r ? 1 : 0;
    case '!=': return l !== r ? 1 : 0;
  }
  throw 0;
}

function evaluate(src, env){
  try {
    var v = evalNode(parseExpr(tokenize(src)), env);
    return typeof v === 'number' && isFinite(v) ? v : null;
  } catch(e){ return null; }
}

/* Deterministic rather than toLocaleString. The share renderer's baselines
   are already tied to the machine that wrote them; a number whose grouping
   followed the viewer's locale would tie the card's height to the viewer too.
   Two decimals at most, trailing zeros trimmed - round() in the formula is
   how a card asks for none. */
function showNumber(v){
  if(v === null) return '\u2014';
  var s = v.toFixed(2).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
  var sign = s.charAt(0) === '-' ? '-' : '';
  if(sign) s = s.slice(1);
  var dot = s.indexOf('.');
  var whole = dot < 0 ? s : s.slice(0, dot);
  return sign + whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',') +
         (dot < 0 ? '' : s.slice(dot));
}

var plainNumber = function(v){
  return v === null ? '\u2014' : v.toFixed(2).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
};

/* Inputs are read before anything is worked out, so a formula can name one
   wherever it sits on the card - a result above its own inputs still resolves.
   Results stay strictly ordered among themselves, which is what keeps a cycle
   impossible; an input is a leaf and can never make one.

   One w= carries every input on the card, in document order, exactly as one k=
   carries every tick. What the reader typed wins over what the sender sent,
   which is what makes the link theirs once they have touched it. */
function readInputs(blocks, written){
  var typed = String(written == null ? '' : written).split('~');
  var env = {}, seen = 0;
  blocks.forEach(function(b){
    if(b.type !== 'i') return;
    b.fields = b.items.map(function(item){
      var parts = item.split('~');
      // Name~Label~Value, and the name is always first even when it is empty.
      // Counting the tildes instead makes i=p~Price ambiguous - a name with no
      // default, or a label with one - and it would guess wrong in silence,
      // which is the one thing a card must never do.
      var name = (parts.shift() || '').trim();
      var label = (parts.shift() || '').trim();
      var sent = parts.join('~').trim();
      var mine = typed[seen++];
      var value = parseFloat(mine !== undefined && mine !== '' ? mine : sent);
      if(!isFinite(value)) value = 0;
      if(name) env[name] = value;
      return {name: name, label: label, value: value};
    });
  });
  return env;
}

/* Results are worked out in document order, and each one joins the
   environment the next can see - so a formula too long to read on one line
   breaks into named steps instead. A result may only name results defined
   above it, which makes a cycle impossible rather than something to detect. */
function computeAll(blocks, written){
  var env = readInputs(blocks, written);
  blocks.forEach(function(b){
    if(b.type !== 'r') return;
    b.computed = b.items.map(function(item){
      var parts = item.split('~');
      var name = (parts.shift() || '').trim();
      var label = (parts.shift() || '').trim();
      /* parse() has already turned every raw + into a space, so a formula
         arrives spaced wherever the model wrote + instead of %2B. Putting them
         all back as + is wrong - "(1 + 2) * 3" would become "(1+2)+*+3" - and
         it is only wrong because a formula is also allowed to be written with
         ordinary spacing. A space touching an operator was never a plus, so
         drop those first; whatever is left sits between two operands, which is
         the one place a + went missing. */
      var expr = parts.join('~')
        .replace(/\s+/g, ' ')
        .replace(/ *([-+*\/(),<>=?:!]) */g, '$1')
        .replace(/ /g, '+');
      var value = expr ? evaluate(expr, env) : null;

      /* The formula is printed so the number can be checked, and a name is
         the one thing in it a reader cannot check - a step with no label is
         not on the card at all, so "s*18" cites something invisible. Names
         resolve to what they held here, which is the difference between
         showing your working and showing your algebra. Substituted before
         this row joins env, so a row can never cite itself. */
      var shown = expr.replace(/[A-Za-z_][A-Za-z0-9_]*/g, function(word){
        return Object.prototype.hasOwnProperty.call(env, word)
          ? plainNumber(env[word]) : word;
      });

      // a row that just cites a step restates its own number - "59700"
      // under 59,700 is noise, not working
      if(shown === plainNumber(value)) shown = '';

      if(name && value !== null) env[name] = value;
      return {label: label, expr: shown, value: value};
    });
  });
}

const listHTML = (cls, items, row) =>
  '<ul class="' + cls + '">' + items.map(row).join('') + '</ul>';

/* Bullets, steps and checklists differ only in their marker, so they share one
   walk. rowSel names the element carrying the row's own font and gap - for a
   checklist that is the <label> inside the <li>, not the <li> itself, and
   taking the wrong one silently mis-measures every line. */
function measureRows(y, m, list, markerWidth, marker, rowSel){
  const items = [...list.children];
  if(!items.length) return y;
  const boxOf = el => rowSel ? el.querySelector(rowSel) : el;
  const row = m.styleOfEl(boxOf(items[0]));
  const rowGap = parseFloat(getComputedStyle(list).rowGap);
  const colGap = parseFloat(row.s.columnGap);

  items.forEach((el, i) => {
    const box = m.block(y, row, m.runsIn(boxOf(el).querySelector('span:last-child'), row.upper),
                        {indent: markerWidth + colGap});
    marker(el, box, row);
    y = box.bottom + (i < items.length - 1 ? rowGap : 0);
  });
  return y;
}

/* f and r draw the same row and differ only in where the value came from, so
   one walk measures both. The extra span r adds is inline, which means
   runsIn already picks it up as its own coloured run and this needs to know
   nothing about it. */
function measureFacts(y, m, section){
  [...section.querySelectorAll('.fact')].forEach((el, i) => {
    const st = m.styleOfEl(el);
    if(i){
      const rule = parseFloat(st.s.borderTopWidth);
      m.ops.push({kind: 'rect', x: m.padX, y, w: m.colWidth, h: rule, color: m.hair});
      y += rule + parseFloat(st.s.paddingTop);
    }
    y = m.block(y, st, m.runsIn(el, st.upper)).bottom + parseFloat(st.s.paddingBottom);
  });
  return y;
}

const BLOCKS = {
  p: {
    body: items => listHTML('points', items, pt =>
      '<li><span class="n">&bull;</span><span>' + esc(pt) + '</span></li>'),

    measure(y, m, section){
      const list = section.querySelector('.points');
      if(!list) return y;
      const dot = getComputedStyle(list.querySelector('.n'));
      const w = parseFloat(dot.width);
      const h = parseFloat(dot.height);
      const top = parseFloat(dot.marginTop);
      return measureRows(y, m, list, w, (el, box) => m.ops.push({
        kind: 'dot', color: m.accent, r: w / 2,
        x: m.padX + w / 2, y: box.top + top + h / 2
      }));
    }
  },

  o: {
    // the digit lives in the markup, not a CSS counter, because the share
    // renderer has to be able to read it
    body: items => '<ol class="steps">' + items.map((step, i) =>
      '<li><span class="n">' + (i + 1) + '</span><span>' + esc(step) + '</span></li>'
    ).join('') + '</ol>',

    measure(y, m, section){
      const list = section.querySelector('.steps');
      if(!list) return y;
      const w = parseFloat(getComputedStyle(list.querySelector('.n')).width);
      return measureRows(y, m, list, w, (el, box) => {
        const marker = el.querySelector('.n');
        const st = m.styleOfEl(marker);
        // same font and line-height as the row, so one baseline serves both
        m.block(box.top, st, m.runsIn(marker, st.upper));
      });
    }
  },

  c: {
    /* A real <input type=checkbox> in a <label>: focusable, tappable along the
       whole row, and a checkbox to a screen reader. A ticked row goes quiet
       rather than struck through, so the renderer reproduces the state for
       free by reading each row's own computed colour. */
    body: (items, ticked) => listHTML('checks', items, (item, i) =>
      '<li><label><input type="checkbox"' +
      (String(ticked || '')[i] === '1' ? ' checked' : '') +
      '><span>' + esc(item) + '</span></label></li>'),

    measure(y, m, section){
      const list = section.querySelector('.checks');
      if(!list) return y;
      const first = getComputedStyle(list.querySelector('input'));
      const size = parseFloat(first.width);
      return measureRows(y, m, list, size, (el, box) => {
        const input = el.querySelector('input');
        const box2 = getComputedStyle(input);
        m.ops.push({
          kind: 'checkbox',
          x: m.padX, y: box.top + parseFloat(box2.marginTop),
          w: size, h: parseFloat(box2.height),
          r: parseFloat(box2.borderTopLeftRadius),
          lineWidth: parseFloat(box2.borderTopWidth),
          checked: input.checked,
          color: input.checked ? box2.backgroundColor : box2.borderTopColor
        });
      }, 'label');
    }
  },

  f: {
    // Label~Value. A tilde needs no escaping and is not one of the characters
    // WhatsApp objects to, so a separator costs one character.
    body(items){
      return '<div class="facts">' + items.map(row => {
        const cut = row.indexOf('~');
        const key = cut < 0 ? row : row.slice(0, cut);
        const value = cut < 0 ? '' : row.slice(cut + 1);
        return '<div class="fact"><span class="fk">' + esc(key) + '</span>' +
               (value ? '<span class="fv">' + esc(value) + '</span>' : '') + '</div>';
      }).join('') + '</div>';
    },

    measure: measureFacts
  },

  n: {
    // Value~Label, in the order you read them
    body(items){
      return '<div class="stats">' + items.map(row => {
        const cut = row.indexOf('~');
        const value = cut < 0 ? row : row.slice(0, cut);
        const label = cut < 0 ? '' : row.slice(cut + 1);
        return '<div class="stat"><div class="sv">' + esc(value) + '</div>' +
               (label ? '<div class="sl">' + esc(label) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    },

    measure(y, m, section){
      const stats = [...section.querySelectorAll('.stat')];
      if(!stats.length) return y;
      const gap = parseFloat(getComputedStyle(section.querySelector('.stats')).rowGap);
      stats.forEach((stat, i) => {
        if(i) y += gap;
        for(const sel of ['.sv', '.sl']){
          const el = stat.querySelector(sel);
          if(!el) continue;
          const st = m.styleOfEl(el);
          y = m.block(y + parseFloat(st.s.marginTop), st, m.runsIn(el, st.upper)).bottom;
        }
      });
      return y;
    }
  },

  i: {
    /* Name~Label~Default. A real number input, so a phone raises the number
       keypad and a screen reader calls it what the label calls it. */
    body(items, _, block){
      const fields = block.fields || [];
      if(!fields.length) return '';
      return listHTML('ins', fields, f =>
        '<li><label><input type="number" inputmode="decimal" step="any" ' +
        'value="' + esc(f.value) + '"><span>' + esc(f.label) + '</span></label></li>'
      );
    },

    /* The box is a fixed width the CSS declares, so the label wraps against a
       column the renderer can be told about rather than one it has to watch -
       which is the same bargain the checklist makes with its 16px tick. */
    measure(y, m, section){
      const list = section.querySelector('.ins');
      if(!list) return y;
      const first = getComputedStyle(list.querySelector('input'));
      const w = parseFloat(first.width);
      return measureRows(y, m, list, w, (el, box) => {
        const input = el.querySelector('input');
        const st = m.styleOfEl(input);
        const s = getComputedStyle(input);
        const h = parseFloat(s.height);
        m.ops.push({
          kind: 'field',
          x: m.padX, y: box.top + parseFloat(s.marginTop), w: w, h: h,
          r: parseFloat(s.borderTopLeftRadius),
          lineWidth: parseFloat(s.borderTopWidth),
          color: s.borderTopColor
        });
        // right-aligned in the DOM, so the canvas has to right-align too or a
        // long number and a short one would sit in different places
        m.ops.push({
          kind: 'text', st,
          right: m.padX + w - parseFloat(s.paddingRight),
          lines: [[{text: input.value, color: st.s.color, x: 0}]],
          x: m.padX, y: box.top + parseFloat(s.marginTop) +
             (h - st.lh) / 2 + parseFloat(s.borderTopWidth)
        });
      }, 'label');
    }
  },

  r: {
    /* Name~Label~Formula, and the same row as f, because a result is a fact
       the card worked out. A row with an empty label is a named step - it
       exists for the formulas below it and is not drawn, which is what keeps
       a long calculation from arriving as one unreadable line. */
    body(items, _, block){
      const rows = (block.computed || []).filter(c => c.label);
      if(!rows.length) return '';
      return '<div class="facts calc">' + rows.map(c =>
        '<div class="fact"><span class="fk">' + esc(c.label) + '</span>' +
        '<span class="fv">' + esc(showNumber(c.value)) + '</span>' +
        (c.expr ? '<span class="fx">' + esc(c.expr) + '</span>' : '') +
        '</div>'
      ).join('') + '</div>';
    },

    measure: measureFacts
  }
};

// own-property lookup only: block keys come from the URL
const blockKind = type =>
  Object.prototype.hasOwnProperty.call(BLOCKS, type) ? BLOCKS[type] : null;

// returns the contents of the three regions - never the regions themselves
function render(d){
  /* head: the mark on top, exactly as the homepage has it, and the sender's
     scope line beneath. The mark used to be left off here - a card is the
     sender's content, not our branding - but iOS Chrome eats the top ~90px of
     every page it opens from another app (example.com and Wikipedia's own
     articles included, so this is not ours to fix). Something has to live in
     that strip. Branding survives being clipped; the scope line does not. */
  var head = '<div class="brand mark">' + LOGO + '<span>upshot.fyi</span></div>';
  if(d.a){
    head += '<div class="brand scope"><span>' + esc(d.a) + '</span></div>';
  }

  var main = '';
  if(d.h) main += '<h1>' + esc(d.h) + '</h1>';
  if(d.v) main += '<p class="verdict">' + esc(d.v) + '</p>';
  main += d.blocks.map(function(b){
    var kind = blockKind(b.type);
    if(!kind) return '';
    // a block that drew nothing is left out entirely rather than left as an
    // empty section - a heading with no body under it reads as a bug
    var inner = kind.body(b.items, d.k, b);
    if(!inner) return '';
    return '<section class="block" data-block="' + b.type + '">' +
      (b.label ? '<h2 class="bl">' + esc(b.label) + '</h2>' : '') +
      inner +
    '</section>';
  }).join('');

  /* the date row is omitted rather than left empty: the column gap applies
     between flex items whatever their size, so an empty one still costs 5px
     the renderer, which skips a blank date, does not draw */
  var date = (d.d || '').trim();
  var foot = '<div class="meta">' +
    '<div class="sig">' +
      '<div class="r1">' + LOGO +
        '<span class="by">Generated by</span>' +
        '<span class="model">' + esc(d.m || 'Unknown model') + '</span></div>' +
      (date ? '<div class="r2">' + esc(date) + '</div>' : '') +
    '</div>' +
    '<div class="acts">' +
      '<button type="button" class="act" id="copyBtn" ' +
        'title="Copy for AI" aria-label="Copy for AI">' + ICON.copy + '</button>' +
      '<button type="button" class="act" id="shareBtn" ' +
        'title="Share as image" aria-label="Share as image">' + ICON.share + '</button>' +
    '</div>' +
    '<p class="sr" id="said" role="status" aria-live="polite"></p>' +
    '</div>' + CREDIT;

  return {head: head, main: main, foot: foot};
}

/* ---- copy for AI ----
   The card as plain text, for pasting into a chat. Nothing leaves the browser
   here - it goes to the clipboard, and where it lands after that is the
   viewer's business, which is what keeps the privacy claim on / true.

   Markers are the ones you would type by hand rather than markdown, so the
   structure survives in a chat box that renders nothing. The provenance goes
   at the FOOT: a model reads the content first and is told what it is second,
   which is the right way round for "is this true?". */
function copyText(d){
  var parts = [];
  if(d.h) parts.push(d.h);
  if(d.v) parts.push(d.v);

  // one k= covers every checklist on the card, in document order - so the tick
  // cursor runs across blocks, not within one
  var tick = 0;
  d.blocks.forEach(function(b){
    var lines = b.label ? [b.label.toUpperCase()] : [];

    /* A result copies with its formula attached. Someone whose first reaction
       is "is that right?" is pasting this into their own model, and the
       arithmetic is the part worth checking. */
    if(b.type === 'i'){
      (b.fields || []).forEach(function(f){
        lines.push(f.label + ': ' + showNumber(f.value));
      });
      if(lines.length) parts.push(lines.join('\n'));
      return;
    }

    if(b.type === 'r'){
      (b.computed || []).forEach(function(c){
        if(c.label) lines.push(c.label + ': ' + showNumber(c.value) +
                               (c.expr ? '  = ' + c.expr : ''));
      });
      if(lines.length) parts.push(lines.join('\n'));
      return;
    }

    b.items.forEach(function(item, i){
      var cut = item.indexOf('~');
      var a = cut < 0 ? item : item.slice(0, cut);
      var z = cut < 0 ? ''   : item.slice(cut + 1);
      if(b.type === 'o')      lines.push((i + 1) + '. ' + item);
      else if(b.type === 'c') lines.push('[' + (String(d.k || '')[tick++] === '1' ? 'x' : ' ') + '] ' + item);
      else if(b.type === 'f') lines.push(a + (z ? ': ' + z : ''));
      else if(b.type === 'n') lines.push(a + (z ? ' - ' + z : ''));
      else                    lines.push('- ' + item);
    });
    parts.push(lines.join('\n'));
  });

  var from = 'Generated by ' + (d.m || 'an unnamed model') + (d.d ? ' on ' + d.d : '');
  parts.push('---\n' + from +
    (d.a ? '\nThe ask: ' + d.a : '') +
    '\nShared as an upshot: ' + location.href);

  return parts.join('\n\n');
}

/* execCommand is the fallback, not the relic: the clipboard API needs a secure
   context, and a card opened from a file:// path or plain http has none. */
function toClipboard(text){
  if(navigator.clipboard?.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    // off-screen but still selectable, and no scroll jump on focus
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // select() alone is a no-op on iOS
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('copy refused'));
  });
}

function bindCopy(d){
  var btn = document.getElementById('copyBtn');
  if(!btn) return;
  btn.addEventListener('click', function(){
    toClipboard(copyText(d)).then(function(){
      actionResult(btn, true, 'Copied. Paste it into any AI');
    }, function(){
      actionResult(btn, false, 'Could not copy');
    });
  });
}

/* Ticks rewrite the fragment, so a viewer who works through a list ends up
   holding a link to their own version and can pass it on. replaceState rather
   than assignment: it leaves the back button alone and fires no hashchange, so
   this cannot loop back into draw(). One k= covers every checklist on the
   card, in document order. */
function bindChecks(){
  var boxes = [].slice.call(document.querySelectorAll('.checks input'));
  if(!boxes.length) return;
  boxes.forEach(function(box){
    box.addEventListener('change', function(){
      writeFragment('k', boxes.map(function(b){
        return b.checked ? '1' : '0';
      }).join(''));
    });
  });
}

/* Typing rewrites the fragment and the results together, so the reader ends
   up holding a link to their own version of the card - the same bargain the
   checklist makes, except what accumulates is their numbers rather than their
   ticks. That is the whole reason the formula lives in the URL instead of the
   answer: a sender's card becomes the reader's card without either of them
   sending anything anywhere.

   The card is never redrawn, only written into. Redrawing would take the
   focus out of the field mid-keystroke, and replaceState leaves the back
   button alone and fires no hashchange, so this cannot loop back into draw(). */
function writeFragment(key, value){
  var frag = location.hash.replace(/^#/, '');
  var re = new RegExp('(^|&)' + key + '=[^&]*');
  history.replaceState(null, '',
    '#' + (re.test(frag) ? frag.replace(re, '$1' + key + '=' + value)
                         : frag + '&' + key + '=' + value));
}

function bindInputs(){
  var boxes = [].slice.call(document.querySelectorAll('.ins input'));
  if(!boxes.length) return;

  var rows = [].slice.call(document.querySelectorAll('.calc .fact'));

  boxes.forEach(function(box){
    box.addEventListener('input', function(){
      writeFragment('w', boxes.map(function(b){
        // a field cleared to nothing is a zero, not a hole: the alternative is
        // every formula below it going to a dash while someone retypes a digit
        var v = parseFloat(b.value);
        return isFinite(v) ? v : 0;
      }).join('~'));

      /* Re-read rather than recompute from the DOM, so the numbers on the card
         and the numbers in the link cannot disagree - the link is the state,
         and this is just what it looks like. */
      var d = parse(location.hash);
      var computed = [];
      d.blocks.forEach(function(b){
        if(b.type !== 'r') return;
        (b.computed || []).forEach(function(c){ if(c.label) computed.push(c); });
      });
      rows.forEach(function(row, i){
        var c = computed[i];
        if(!c) return;
        row.querySelector('.fv').textContent = showNumber(c.value);
        var fx = row.querySelector('.fx');
        if(fx) fx.textContent = c.expr;
      });
    });
  });
}

if('scrollRestoration' in history){ history.scrollRestoration = 'manual'; }

function draw(){
  var d = parse(location.hash);
  // Nothing renderable in the link - no headline, no verdict, no blocks. That
  // is its own page, not a card that says it is not a card: this document only
  // ever draws exports, and /broken/ only ever explains a bad link.
  if(!d.h && !d.v && !d.blocks.length){ location.replace('../broken/'); return; }
  var r = render(d);
  // fill the existing regions; the shell itself is never rebuilt, so the
  // layout does not change shape mid-load
  document.getElementById('head').innerHTML = r.head;
  document.getElementById('main').innerHTML = r.main;
  document.getElementById('foot').innerHTML = r.foot;
  shareImage.bind();
  bindCopy(d);
  bindChecks();
  bindInputs();
  window.scrollTo(0, 0);
}


/* ---- share as image ----
   We draw the card ourselves rather than screenshotting the DOM. Browsers
   expose no screenshot API, so the library we used before (html2canvas)
   re-implemented CSS painting in JS and had to GUESS the card's height -
   long exports came back clipped, and only sometimes, which is the worst
   kind of bug. Here the wrapping runs first and the canvas is sized from
   line counts we already measured, so nothing can fall off the bottom.
   Every metric comes off the live card's computed style, so the stylesheet
   stays the one place the design is defined. */
const shareImage = (() => {

  /* the card's own geometry, which is now the same at every width - the
     image is a fixed artifact, so it does not read this from the viewport */
  const IMG = {w: 430, padX: 26, padT: 40, padB: 30, radius: 0};

  /* browsers cap canvas size - iOS Safari is the tight one, around 4096 per
     side plus a total-area ceiling - and going over throws nothing. You just
     get a truncated or blank bitmap. This is what actually clipped the long
     cards, so the scale bends instead of the image. No floor of 1: a card
     tall enough to need shrinking below 1 is exactly the case this exists
     for. */
  const MAX_SIDE = 4096;
  const MAX_AREA = 16777216;
  const pickScale = (w, h) => Math.min(
    3, (window.devicePixelRatio || 1) * 2,
    MAX_SIDE / w, MAX_SIDE / h, Math.sqrt(MAX_AREA / (w * h))
  );

  const cssVar = name =>
    getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  /* Typography for one element. Only line-height and letter-spacing get a
     fallback - they are the two that can come back as "normal" instead of a
     length. Every box metric resolves to px on a rendered element, so
     reading those needs no default, and giving them one would just be the
     design written down a second time. */
  const styleOf = selector => styleOfEl(document.querySelector(selector));

  function styleOfEl(el){
    if(!el) return null;
    const s = getComputedStyle(el);
    const size = parseFloat(s.fontSize);
    const lh = parseFloat(s.lineHeight);
    const track = parseFloat(s.letterSpacing);
    return {
      el, s, size,
      font: `${s.fontStyle} ${s.fontWeight} ${size}px ${s.fontFamily}`,
      lh: Number.isFinite(lh) ? lh : size * 1.2,
      track: Number.isFinite(track) ? track : 0,
      upper: s.textTransform === 'uppercase',
      marginBottom: parseFloat(s.marginBottom)
    };
  }

  function useFont(ctx, st){
    ctx.font = st.font;
    // tracking is honoured by measureText too, so wrapping and drawing always
    // agree - and where it is unsupported both ignore it, which is still
    // consistent. That agreement is the whole reason this cannot clip.
    if('letterSpacing' in ctx) ctx.letterSpacing = `${st.track}px`;
  }

  const widthOf = (ctx, text) => ctx.measureText(text).width;

  // ascent and descent of the current font, for placing baselines
  function fontMetrics(ctx, size){
    const m = ctx.measureText('Hxg');
    return Number.isFinite(m.fontBoundingBoxAscent)
      ? {ascent: m.fontBoundingBoxAscent, descent: m.fontBoundingBoxDescent}
      : {ascent: size * 0.8, descent: size * 0.2};
  }

  // overflow-wrap:anywhere parity - a token wider than the column is split by
  // character instead of being allowed to run past the edge
  function splitToken(ctx, token, maxWidth){
    const chunks = [];
    let cur = '';
    for(const ch of token){
      if(cur && widthOf(ctx, cur + ch) > maxWidth){ chunks.push(cur); cur = ''; }
      cur += ch;
    }
    if(cur) chunks.push(cur);
    return chunks;
  }

  /* Lays coloured runs into lines. One font per block, so this is a single
     measuring pass; used for the plain blocks (one run) and for the signature
     and credit, which change colour mid-sentence. */
  function flowRuns(ctx, runs, maxWidth){
    const lines = [[]];
    let lineWidth = 0;

    const put = (text, color, lead) => {
      const w = widthOf(ctx, text);
      if(lineWidth && lineWidth + lead + w > maxWidth){
        lines.push([]);
        lineWidth = 0;
        lead = 0;
      }
      lines.at(-1).push({text, color, x: lineWidth + lead});
      lineWidth += lead + w;
    };

    for(const run of runs){
      const words = run.text.split(/\s+/).filter(Boolean);
      words.forEach((word, i) => {
        // between runs: an explicit margin if there is one, otherwise a word
        // space only where the markup actually had whitespace
        const lead = lineWidth === 0 ? 0
          : i === 0 ? (run.gap || (run.spaced ? widthOf(ctx, ' ') : 0))
          : widthOf(ctx, ' ');
        if(widthOf(ctx, word) > maxWidth){
          for(const chunk of splitToken(ctx, word, maxWidth)) put(chunk, run.color, 0);
        } else {
          put(word, run.color, lead);
        }
      });
    }
    return lines;
  }

  /* text-wrap:balance, which the h1 asks for and greedy wrapping will not
     give you. Same idea the browser uses: squeeze the column down to the
     narrowest width that still fits in the same number of lines, so the last
     line is not a runt. */
  function balanceLines(ctx, runs, maxWidth, target){
    let lo = 1;
    let hi = maxWidth;
    while(hi - lo > 1){
      const mid = (lo + hi) / 2;
      if(flowRuns(ctx, runs, mid).length <= target) hi = mid; else lo = mid;
    }
    return flowRuns(ctx, runs, hi);
  }

  const wantsBalance = s =>
    `${s.textWrap} ${s.textWrapStyle}`.includes('balance');

  /* Child nodes as coloured runs, so a .cmd or .model span keeps its own
     colour. The mark is drawn separately, so skip the svg. Each run records
     whether the markup put whitespace before it - trimming the nodes without
     that would weld "to" onto "read upshot.fyi". */
  function runsIn(el, upper){
    const runs = [];
    let pendingSpace = false;

    for(const node of el.childNodes){
      if(node.nodeName === 'svg') continue;
      const raw = (node.textContent ?? '').replace(/\s+/g, ' ');
      if(!raw.trim()){
        if(raw) pendingSpace = true;
        continue;
      }
      const isEl = node.nodeType === Node.ELEMENT_NODE;
      const s = getComputedStyle(isEl ? node : el);
      const text = raw.trim();
      runs.push({
        text: upper ? text.toUpperCase() : text,
        color: s.color,
        gap: isEl ? parseFloat(s.marginLeft) : 0,
        spaced: pendingSpace || raw.startsWith(' ')
      });
      pendingSpace = raw.endsWith(' ');
    }
    return runs;
  }

  /* ---- layout: a flat op list, and the exact height it needs ---- */
  function layout(){
    const accent = cssVar('--accent');
    const hair = cssVar('--hair');
    const ctx = document.createElement('canvas').getContext('2d');
    const colWidth = IMG.w - IMG.padX * 2;
    const ops = [];
    let y = IMG.padT;

    // one text block at `top`: measure, emit, hand back the box it occupies.
    // The caller owns the cursor - this does not move it.
    function block(top, st, runs, {indent = 0} = {}){
      const width = colWidth - indent;
      useFont(ctx, st);
      let lines = flowRuns(ctx, runs, width);
      if(wantsBalance(st.s)) lines = balanceLines(ctx, runs, width, lines.length);
      const height = lines.length * st.lh;
      ops.push({kind: 'text', st, lines, x: IMG.padX + indent, y: top});
      return {top, height, bottom: top + height};
    }

    /* Every .brand row in the head, in order: the mark, then the scope line.
       Only the mark row carries a logo, and "upshot.fyi" cannot wrap - so
       indenting that whole block is exact, while the scope line, which can
       wrap to several lines, gets the full column. */
    const headEl = document.getElementById('head');
    const brandRows = [...headEl.querySelectorAll('.brand')];
    brandRows.forEach(el => {
      const st = styleOfEl(el);
      const mark = el.querySelector('.logo');
      const ms = mark ? getComputedStyle(mark) : null;
      const indent = ms ? parseFloat(ms.width) + parseFloat(ms.marginRight) : 0;
      const box = block(y, st, runsIn(el, st.upper), {indent});
      if(ms){
        ops.push({
          kind: 'logo', color: accent, x: IMG.padX,
          y: box.top + parseFloat(ms.marginTop),
          w: parseFloat(ms.width), h: parseFloat(ms.height)
        });
      }
      y = box.bottom + parseFloat(st.s.marginBottom);
    });
    if(brandRows.length){
      y += parseFloat(getComputedStyle(headEl).paddingBottom);
    }

    const heading = styleOf('#main h1');
    if(heading){
      y = block(y, heading, runsIn(heading.el, heading.upper)).bottom
        + heading.marginBottom;
    }

    const verdict = styleOf('#main .verdict');
    if(verdict){
      const rule = parseFloat(verdict.s.borderLeftWidth);
      const box = block(y, verdict, runsIn(verdict.el, verdict.upper),
                        {indent: rule + parseFloat(verdict.s.paddingLeft)});
      ops.push({kind: 'rect', x: IMG.padX, y: box.top, w: rule, h: box.height, color: accent});
      y = box.bottom + verdict.marginBottom;
    }

    // the broken-link page is the only thing with plain paragraphs, and it
    // has two of them - so this loops rather than taking the first
    const para = styleOf('#main p:not(.verdict)');
    if(para){
      for(const el of document.querySelectorAll('#main p:not(.verdict)')){
        // its own computed margin, so "main > :last-child" is honoured
        y = block(y, para, runsIn(el, para.upper)).bottom
          + parseFloat(getComputedStyle(el).marginBottom);
      }
    }

    // up to three blocks fill the space between the verdict and the foot
    const m = {block, ops, accent, hair, colWidth, styleOf, styleOfEl, runsIn, padX: IMG.padX};
    [...document.querySelectorAll('#main .block')].forEach((section, i) => {
      if(i) y += parseFloat(getComputedStyle(section).marginTop);
      const label = section.querySelector('.bl');
      if(label){
        const st = styleOfEl(label);
        y = block(y, st, runsIn(label, st.upper)).bottom + st.marginBottom;
      }
      const kind = blockKind(section.dataset.block);
      if(kind) y = kind.measure(y, m, section);
    });

    // foot: hairline, then signature and credit
    const foot = getComputedStyle(document.getElementById('foot'));
    const hairline = parseFloat(foot.borderTopWidth);
    y += parseFloat(foot.marginTop);
    ops.push({kind: 'rect', x: IMG.padX, y, w: colWidth, h: hairline, color: hair});
    y += hairline + parseFloat(foot.paddingTop);

    const sig = styleOf('.meta .r1');
    if(sig){
      const mark = getComputedStyle(document.querySelector('.meta .logo'));
      const markW = parseFloat(mark.width);
      // the mark floats on the page so wrapped lines return to the margin;
      // here the whole line is indented instead. A two-word signature never
      // wraps, so the difference is not reachable.
      const box = block(y, sig, runsIn(sig.el, sig.upper),
                        {indent: markW + parseFloat(mark.marginRight)});
      ops.push({
        kind: 'logo', color: accent, x: IMG.padX,
        y: box.top + parseFloat(mark.marginTop),
        w: markW, h: parseFloat(mark.height)
      });
      y = box.bottom;

      const date = styleOf('.meta .r2');
      if(date?.el.textContent.trim()){
        y += parseFloat(getComputedStyle(document.querySelector('.meta .sig')).rowGap);
        y = block(y, date, runsIn(date.el, date.upper)).bottom;
      }
    }

    const credit = styleOf('footer .how');
    if(credit){
      y += parseFloat(getComputedStyle(document.querySelector('#foot footer')).marginTop);
      y = block(y, credit, runsIn(credit.el, credit.upper)).bottom;
    }

    return {width: IMG.w, height: Math.ceil(y + IMG.padB), ops, background: cssVar('--card')};
  }

  /* ---- paint ---- */
  function roundedPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    if(ctx.roundRect){ ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // the mark, same 12x10 geometry as the SVG - see .logo
  function drawLogo(ctx, {x, y, w, color}){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(w / 12, w / 12);
    ctx.fillStyle = color;
    roundedPath(ctx, 0, 0, 12, 2, 1); ctx.fill();
    roundedPath(ctx, 0, 4, 7, 2, 1); ctx.fill();
    ctx.beginPath();
    ctx.arc(1.5, 8.5, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawText(ctx, op){
    useFont(ctx, op.st);
    /* An op that names a right edge is measured here rather than at layout
       time: layout does not own a context, and the width of a number is a
       font question. Nothing else on the card is right-aligned - a field is,
       because the digits have to line up down the column. */
    if(op.right !== undefined){
      const run = op.lines[0][0];
      op = Object.assign({}, op, {x: op.right - widthOf(ctx, run.text)});
    }
    // CSS half-leading: the glyph box is centred in the line box, so the
    // baseline sits (lh - ascent - descent)/2 + ascent below the line top
    const {ascent, descent} = fontMetrics(ctx, op.st.size);
    const halfLeading = (op.st.lh - ascent - descent) / 2;
    op.lines.forEach((line, i) => {
      const baseline = op.y + i * op.st.lh + halfLeading + ascent;
      for(const run of line){
        ctx.fillStyle = run.color;
        ctx.fillText(run.text, op.x + run.x, baseline);
      }
    });
  }

  function paint({width, height, ops, background}){
    const scale = pickScale(width, height);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);

    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    // transparent outside the corners - the card is an object, not a page
    ctx.fillStyle = background;
    roundedPath(ctx, 0, 0, width, height, IMG.radius);
    ctx.fill();

    for(const op of ops){
      switch(op.kind){
        case 'rect':
          ctx.fillStyle = op.color;
          ctx.fillRect(op.x, op.y, op.w, op.h);
          break;
        case 'dot':
          ctx.fillStyle = op.color;
          ctx.beginPath();
          ctx.arc(op.x, op.y, op.r, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'checkbox':
          // filled when ticked, outlined when not - same two states the CSS has
          roundedPath(ctx, op.x, op.y, op.w, op.h, op.r);
          if(op.checked){
            ctx.fillStyle = op.color;
            ctx.fill();
          } else {
            ctx.strokeStyle = op.color;
            ctx.lineWidth = op.lineWidth;
            ctx.stroke();
          }
          break;
        case 'field':
          // outline only: a filled box would read as a value rather than a
          // place to put one
          roundedPath(ctx, op.x, op.y, op.w, op.h, op.r);
          ctx.strokeStyle = op.color;
          ctx.lineWidth = op.lineWidth;
          ctx.stroke();
          break;
        case 'logo':
          drawLogo(ctx, op);
          break;
        case 'text':
          drawText(ctx, op);
          break;
      }
    }
    return canvas;
  }

  /* ---- delivery ---- */
  const fileName = () => {
    const headline = (parse(location.hash).h || 'export').toLowerCase();
    const stem = headline.replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
    return `${stem || 'export'}.png`;
  };

  const toBlob = canvas =>
    new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

  function download(file){
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function bind(){
    const btn = document.getElementById('shareBtn');
    if(!btn) return;

    btn.addEventListener('click', async () => {
      // drawing takes long enough to notice, and an icon that does not react
      // reads as a button that did not register the tap
      btn.disabled = true;
      try {
        // measuring before the faces are ready would wrap against fallback
        // metrics, and the image would not match the page
        await document.fonts.ready;
        const blob = await toBlob(paint(layout()));
        if(!blob) throw new Error('canvas produced no blob');

        const file = new File([blob], fileName(), {type: 'image/png'});
        // native share sheet on phones, so it can go straight to any app
        if(navigator.canShare?.({files: [file]})){
          await navigator.share({files: [file]});
          actionResult(btn, true, 'Shared');
        } else {
          download(file);
          actionResult(btn, true, 'Image saved');
        }
      } catch(e){
        // dismissing the share sheet is a decision, not a failure - say
        // nothing and put the icon back
        if(e?.name !== 'AbortError') actionResult(btn, false, 'Could not render the image');
      } finally {
        btn.disabled = false;
      }
    });
  }

  return {bind, layout, paint};
})();

draw();
window.addEventListener('hashchange', draw);

</script>
