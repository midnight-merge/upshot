<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root{
  --page:#E7E8E4;
  --ground:#FCFCFA;
  --ink:#16181C;
  --muted:#6E7472;
  --faint:#9AA09D;
  --rule:#E3E5E1;
  --accent:#2F5D50;
  --shadow:0 1px 2px rgba(22,24,28,.05),0 12px 32px rgba(22,24,28,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0A0B0D;
    --ground:#111316;
    --ink:#E9EBE7;
    --muted:#969C99;
    --faint:#6A706D;
    --rule:#23262A;
    --accent:#84B8A6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --page:#0A0B0D;
  --ground:#111316;
  --ink:#E9EBE7;
  --muted:#969C99;
  --faint:#6A706D;
  --rule:#23262A;
  --accent:#84B8A6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  padding:0;
}

/* the phone column — same width everywhere */
.sheet{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--ground);
  border-left:1px solid var(--rule);
  border-right:1px solid var(--rule);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
}
@media (min-width:460px){
  body{padding:32px 0}
  .sheet{min-height:calc(100vh - 64px);border-radius:2px}
}

/* ---- container chrome: metadata, always present ---- */
.meta{
  display:flex;
  align-items:center;
  gap:8px;
  padding:18px 26px 16px;
  border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--faint);
}
.meta .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);flex:none}
.meta .sep{color:var(--rule)}
.meta .model{color:var(--muted)}

.ask{
  padding:22px 26px 24px;
  border-bottom:1px solid var(--rule);
}
.ask-label{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--faint);
  margin-bottom:7px;
}
.ask-text{
  font-size:14px;
  line-height:1.5;
  color:var(--muted);
}

/* ---- body: the "explainer" shape ---- */
main{padding:28px 26px 0;flex:1}

h1{
  font-family:Newsreader,Georgia,"Times New Roman",serif;
  font-weight:400;
  font-size:31px;
  line-height:1.18;
  letter-spacing:-.011em;
  text-wrap:balance;
  margin:0 0 18px;
}

.verdict{
  font-family:Newsreader,Georgia,serif;
  font-size:18px;
  line-height:1.45;
  color:var(--ink);
  margin:0 0 22px;
  padding-left:14px;
  border-left:2px solid var(--accent);
}

p{margin:0 0 16px;font-size:15.5px}
p:last-child{margin-bottom:0}

.points{
  list-style:none;
  margin:22px 0 4px;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:14px;
  border-top:1px solid var(--rule);
  padding-top:20px;
}
.points li{display:flex;gap:12px;font-size:14.5px;line-height:1.5}
.points .n{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  color:var(--accent);
  padding-top:3px;
  flex:none;
}
.points strong{font-weight:500}

footer{
  margin-top:32px;
  padding:16px 26px 20px;
  border-top:1px solid var(--rule);
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--faint);
}
footer{flex-direction:column;align-items:stretch;gap:10px}
footer .frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
footer .mark{color:var(--muted);font-weight:500;letter-spacing:.1em}
footer .how{
  text-transform:none;
  letter-spacing:0;
  font-family:"IBM Plex Sans",sans-serif;
  font-size:11.5px;
  color:var(--faint);
}
footer .cmd{color:var(--accent);white-space:nowrap}
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>

<script>
var SHAPES = ['explainer'];

function parse(hash){
  var out = {p:[]};
  hash.replace(/^#/,'').split('&').forEach(function(pair){
    if(!pair) return;
    var i = pair.indexOf('=');
    if(i < 0) return;
    var k = pair.slice(0,i);
    var v = decodeURIComponent(pair.slice(i+1).replace(/\+/g,' '));
    if(k === 'p') out.p.push(v); else out[k] = v;
  });
  return out;
}

function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function broken(){
  return '<div class="meta"><span class="dot"></span><span class="model">' +
    'Nothing to show</span></div>' +
    '<main><h1>This link looks incomplete</h1>' +
    '<p>The export is missing its content. This usually means the link got cut ' +
    'short when it was copied, or the AI that wrote it slipped on the format.</p>' +
    '<p>Ask the AI to export it again, and send the whole link this time.</p>' +
    '</main>' +
    '<footer><div class="frow"><span class="mark">ai-export</span></div>' +
    '<div class="how">Make your own: tell your AI ' +
    '<span class="cmd">export this to aiexport.com</span></div></footer>';
}

function render(d){
  if(!d.h && !d.v && !d.p.length) return broken();
  // unknown shape falls back to the plainest one
  var shape = SHAPES.indexOf(d.s) >= 0 ? d.s : 'explainer';
  var h = '';

  // container: always drawn
  h += '<div class="meta"><span class="dot"></span>';
  h += '<span class="model">' + esc(d.m || 'Unknown model') + '</span>';
  h += '<span class="sep">/</span><span>' + esc(d.d || '') + '</span></div>';

  if(d.a){
    h += '<div class="ask"><div class="ask-label">What this covers</div>' +
         '<div class="ask-text">' + esc(d.a) + '</div></div>';
  }

  // shape
  h += '<main>';
  if(d.h) h += '<h1>' + esc(d.h) + '</h1>';
  if(d.v) h += '<p class="verdict">' + esc(d.v) + '</p>';
  if(d.b) h += '<p>' + esc(d.b) + '</p>';
  if(d.p.length){
    h += '<ul class="points">';
    d.p.forEach(function(pt, i){
      var n = String(i + 1);
      if(n.length < 2) n = '0' + n;
      h += '<li><span class="n">' + n + '</span><span>' + esc(pt) + '</span></li>';
    });
    h += '</ul>';
  }
  h += '</main>';

  h += '<footer><div class="frow"><span class="mark">ai-export</span>' +
       '<span>AI summary</span></div>' +
       '<div class="how">Make your own: tell your AI ' +
       '<span class="cmd">export this to aiexport.com</span></div></footer>';
  return h;
}

document.getElementById('sheet').innerHTML = render(parse(location.hash));
window.addEventListener('hashchange', function(){
  document.getElementById('sheet').innerHTML = render(parse(location.hash));
});
</script>
</body>
</html>
