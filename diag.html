<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>upshot diag</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:#12131A;color:#F7F7F4;
  font-family:"DM Mono",ui-monospace,Menlo,monospace;
  font-size:12px;line-height:1.45;
  height:100svh;overflow:hidden;
}
/* a red bar as the FIRST thing in the document - if you cannot see this,
   the top of the document is sitting behind the browser chrome */
.topmark{
  background:#FF2D55;color:#fff;font-weight:700;
  padding:5px 8px;text-align:center;letter-spacing:.08em;
}
.botmark{
  background:#C8FF3D;color:#000;font-weight:700;
  padding:5px 8px;text-align:center;letter-spacing:.08em;
}
.body{padding:8px;overflow:auto;height:calc(100svh - 56px)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:2px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
th{color:#8E91A6;font-weight:400;font-size:10px;text-transform:uppercase}
td.k{color:#8E91A6}
td.a{color:#C8FF3D}
td.b{color:#F7F7F4}
.diff td.b{color:#FF2D55;font-weight:700}
/* probes: elements sized in each viewport unit so we can read what the
   browser actually resolves them to */
.probe{position:absolute;visibility:hidden;width:1px}
</style>
</head>
<body>
<div class="topmark">TOP OF DOCUMENT — IF THIS IS CUT OFF, THAT IS THE BUG</div>
<div class="body">
<table id="t">
  <tr><th>metric</th><th>at load</th><th>now</th></tr>
</table>
</div>
<div class="botmark">BOTTOM OF DOCUMENT</div>

<div class="probe" id="p-svh" style="height:100svh"></div>
<div class="probe" id="p-lvh" style="height:100lvh"></div>
<div class="probe" id="p-dvh" style="height:100dvh"></div>
<div class="probe" id="p-vh"  style="height:100vh"></div>

<script>
function px(n){ return n == null ? '-' : (Math.round(n * 10) / 10) + ''; }

function snap(){
  var vv = window.visualViewport;
  var de = document.documentElement;
  var se = document.scrollingElement || de;
  var mark = document.querySelector('.topmark');
  return {
    'screen.height':        px(screen.height),
    'window.innerHeight':   px(window.innerHeight),
    'documentEl.clientH':   px(de.clientHeight),
    'visualViewport.height':px(vv && vv.height),
    'visualViewport.offsetTop': px(vv && vv.offsetTop),
    'visualViewport.pageTop':   px(vv && vv.pageTop),
    'visualViewport.scale': vv ? String(vv.scale) : '-',
    'scrollTop':            px(se.scrollTop),
    'body.scrollHeight':    px(document.body.scrollHeight),
    '100svh resolves to':   px(document.getElementById('p-svh').getBoundingClientRect().height),
    '100lvh resolves to':   px(document.getElementById('p-lvh').getBoundingClientRect().height),
    '100dvh resolves to':   px(document.getElementById('p-dvh').getBoundingClientRect().height),
    '100vh  resolves to':   px(document.getElementById('p-vh').getBoundingClientRect().height),
    'TOPMARK rect.top':     px(mark.getBoundingClientRect().top),
    'devicePixelRatio':     String(window.devicePixelRatio)
  };
}

var atLoad = snap();
var rows = {};
var t = document.getElementById('t');
Object.keys(atLoad).forEach(function(k){
  var tr = document.createElement('tr');
  tr.innerHTML = '<td class="k">' + k + '</td><td class="a">' + atLoad[k] +
                 '</td><td class="b">-</td>';
  t.appendChild(tr);
  rows[k] = tr;
});

function update(){
  var now = snap();
  Object.keys(now).forEach(function(k){
    var tr = rows[k];
    tr.cells[2].textContent = now[k];
    if(now[k] !== atLoad[k]) tr.classList.add('diff'); else tr.classList.remove('diff');
  });
}
update();
setInterval(update, 250);
if(window.visualViewport){
  visualViewport.addEventListener('resize', update);
  visualViewport.addEventListener('scroll', update);
}
addEventListener('resize', update);
addEventListener('scroll', update);
</script>
</body>
</html>
