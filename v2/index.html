<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- How the link looks when it is pasted somewhere. A fragment never reaches
     the server, so a crawler cannot see THIS card - it sees the page every
     card is served from. So the preview says what is true of all of them:
     someone sent you one, and the link is the whole of it. Deliberately no
     og:url here: some clients treat it as the canonical link and would rewrite
     the share to it, which on a card would drop the fragment - the whole
     export - on the floor. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="upshot">
<meta property="og:title" content="Someone sent you an upshot">
<meta property="og:description" content="The whole thing is the link.">
<meta property="og:image" content="https://upshot.fyi/v2/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="upshot.fyi - someone sent you an upshot">
<meta name="twitter:card" content="summary_large_image">
<title>upshot - export</title>
<meta name="robots" content="noindex">
<style>
/* the card commits to one look in both themes - it is an object, not a document */
:root{
  --card:#12131A;
  --ink:#F7F7F4;
  --dim:#B4B6C2;
  --faint:#8E91A6;
  --accent:#C8FF3D;
  --hair:rgba(247,247,244,.12);
  /* the platform's own faces - nothing to download, and none of the
     Google-Fonts pairings that read as templated */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--card);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  /* export content is arbitrary AI text with no length guarantee - never let
     one long unbroken token overflow the card and trigger mobile auto-zoom */
  overflow-wrap:anywhere;
  /* Trailing space at the end of the document. Chrome on iOS stops the scroll
     with the last of the page still under its bottom toolbar - you can drag
     past it, but it rubber-bands straight back. Ordinary sites do not show
     this because they have slack down there; this card ended 30px after the
     credit line. Static, because the moment the two viewport heights diverge
     is not one that fires any event to measure at. */
  padding-bottom:160px;

  /* an ordinary scrolling document - no viewport lock, no nested scrollport,
     and deliberately no min-height:100vh. On iOS, 100vh is the LARGE viewport
     (the height with the address bar retracted), so it stretches the body
     past the visible area and even a two-line card scrolls. Nothing needs it:
     the body's background propagates to the canvas, so the page paints edge
     to edge however short the card is. */
}

.sheet{
  width:100%;
  max-width:430px;
  background:var(--card);
  padding:40px 26px 30px;
}

/* head - brand on the homepage, the scope line on a card */
.head{padding-bottom:22px}
/* the mark sits in the strip iOS clips, so the scope line clears it */
.head .mark{margin-bottom:34px}
/* a card with no scope line has nothing up top - take the gap with it */
.head:empty{padding-bottom:0}
/* foot - the hairline and spacing live HERE, not on .meta, so the homepage
   (credit only) and a card (signature + credit) open the same way */
.foot{
  margin-top:34px;
  padding-top:18px;
  border-top:1px solid var(--hair);
}
.foot > :first-child{margin-top:0}

/* Embedded as the hero demo on our own homepage. A card in a frame is still
   the same card - it just drops the two things that only make sense on a page
   of its own: the brand line, which the embedding page already carries, and
   the scroll slack at the foot, which exists for iOS toolbars and not for a
   box on someone else's page. See asEmbed(). */
.embed body{padding-bottom:0}
.embed .sheet{padding:22px 22px 20px}
.embed a.brand{display:none}
.embed footer .how{display:none}

/* the page scrolls, not this - ordinary flow */
main > :last-child{margin-bottom:0}

/* ONE header line, used by both the homepage and a card. Only the text
   inside it ever differs - so the header does not change size, weight or
   colour when you go from one to the other. */
.brand{
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.5;
  letter-spacing:.01em;
  color:var(--faint);
}
.brand::after{content:"";display:block;clear:both}
/* The mark is the way back to the site from someone else's card, the same as
   it is on every other page here. Block, because an anchor is inline by
   default and the floated mark would clear differently. */
a.brand{display:block;border-bottom:0;color:var(--faint)}
a.brand:hover{color:var(--accent)}
a.brand:hover .logo{fill:var(--accent)}
a.brand:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* the mark: lines of text distilling down to a single point - the upshot.
   Floated, not a flex child, so only the FIRST line clears it - wrapped
   lines run back to the full width instead of the whole block indenting. */
.logo{
  float:left;
  width:12px;
  height:10px;
  margin:4px 8px 0 0;   /* top nudge sits it on the first line */
  fill:var(--accent);
}

h1{
  font-weight:700;
  font-size:35px;
  line-height:1.06;
  letter-spacing:-.032em;
  text-wrap:balance;
  margin:0 0 22px;
}

.verdict{
  font-size:19.5px;
  font-weight:400;
  line-height:1.42;
  letter-spacing:-.008em;
  color:var(--dim);
  margin:0 0 34px;
  padding-left:15px;
  border-left:2px solid var(--accent);
}

p{margin:0 0 15px;font-size:15px;color:var(--dim)}

.points{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.points li{
  display:flex;
  gap:12px;
  font-size:15.5px;
  line-height:1.5;
  color:var(--dim);
}
.points .n{
  color:transparent;
  flex:none;
  width:5px;
  height:5px;
  margin-top:9px;
  border-radius:50%;
  background:var(--accent);
  overflow:hidden;
}
.points strong{font-weight:600;color:var(--ink)}

/* checklist - a real <input type=checkbox> inside a <label>, so it is
   focusable, tappable anywhere along the row, and reaches a screen reader as
   a checkbox. appearance:none only takes the native look away, not the
   semantics. A ticked item goes quiet rather than struck through: the share
   renderer reads each row's own computed colour, so the state costs it
   nothing to reproduce. */
.checks{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.checks label{
  display:flex;
  gap:12px;
  align-items:flex-start;
  cursor:pointer;
  font-size:15.5px;
  line-height:1.5;
  color:var(--dim);
}
.checks input{
  appearance:none;
  -webkit-appearance:none;
  flex:none;
  width:16px;
  height:16px;
  margin:3px 0 0;
  border:1.5px solid var(--faint);
  border-radius:4px;
  background:transparent;
  cursor:pointer;
}
.checks input:checked{background:var(--accent);border-color:var(--accent)}
.checks input:checked + span{color:var(--faint)}
.checks input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* pick-one - the checklist row, drawn round. Same geometry to the pixel, so a
   card carrying both reads as one list of questions rather than two widgets;
   round against square is the only thing saying that this one is exclusive.
   The chosen row stays lit while the others go quiet, which is the opposite of
   a tick going quiet when it is done - here the choice IS the answer. */
.picks{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.picks label{
  display:flex;
  gap:12px;
  align-items:flex-start;
  cursor:pointer;
  font-size:15.5px;
  line-height:1.5;
  color:var(--faint);
}
.picks input{
  appearance:none;
  -webkit-appearance:none;
  flex:none;
  width:16px;
  height:16px;
  margin:3px 0 0;
  border:1.5px solid var(--faint);
  border-radius:50%;
  background:transparent;
  cursor:pointer;
}
/* the dot is an inset ring rather than a child element, so the control stays
   one box and the row cannot reflow when the choice moves */
.picks input:checked{
  border-color:var(--accent);
  background:var(--accent);
  box-shadow:inset 0 0 0 3px var(--card);
}
.picks input:checked + span{color:var(--ink)}
.picks input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* inputs - a checklist row with a number in place of the tick. Same shape for
   the same reason: a control on the left the reader can change, and what it is
   called beside it. The width is fixed rather than fitted to the value, so a
   number growing a digit cannot reflow the label next to it. */
.ins{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.ins label{
  display:flex;
  gap:12px;
  align-items:flex-start;
  cursor:pointer;
  font-size:15.5px;
  line-height:1.5;
  color:var(--dim);
}
.ins input{
  appearance:none;
  -webkit-appearance:none;
  flex:none;
  width:72px;
  margin:0;
  padding:1px 7px;
  border:1.5px solid var(--faint);
  border-radius:4px;
  background:transparent;
  color:var(--ink);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  text-align:right;
}
.ins input::-webkit-outer-spin-button,
.ins input::-webkit-inner-spin-button{appearance:none;margin:0}
.ins input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* the unit a name is printed in, on the label of the box that carries it */
.iu{margin-left:6px;font-family:var(--mono);font-size:12.5px;color:var(--faint)}

/* steps - ordered, so the marker is the number itself rather than a dot. It
   carries the row's font and line-height so the two line boxes are identical
   and the baselines agree without being told to. */
.steps{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.steps li{
  display:flex;
  gap:12px;
  font-size:15.5px;
  line-height:1.5;
  color:var(--dim);
}
.steps .n{
  flex:none;
  width:20px;
  font-weight:600;
  color:var(--accent);
}

/* facts - a spec sheet, which is what most people actually wanted a table for.
   One line per row, label then value, both in the mono register so a single
   font covers the row. */
.facts{margin:0}
.fact{
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.6;
  color:var(--ink);
  padding-bottom:9px;
}
.fact + .fact{border-top:1px solid var(--hair);padding-top:9px}
.fact:last-child{padding-bottom:0}
.fact .fv{margin-left:10px}
.fact .fk{color:var(--faint)}

/* results - a fact the card worked out rather than one it was handed. The
   formula rides in the same row so the number can be checked: a figure a
   reader cannot audit is worse than prose, because arithmetic looks
   objective in a way a sentence does not. Tabular figures keep a recomputed
   value the same width as the one it replaced. */
.calc .fv{font-variant-numeric:tabular-nums}
.calc .fx{margin-left:10px;color:var(--faint)}

/* stats - two to four figures. The number carries the card, so it gets
   headline treatment and the label stays out of its way. */
.stats{
  margin:0;
  display:flex;
  flex-direction:column;
  gap:22px;
}
.stat .sv{
  font-size:34px;
  font-weight:700;
  line-height:1.12;
  letter-spacing:-.03em;
  color:var(--ink);
}
.stat .sl{
  font-size:13px;
  line-height:1.4;
  color:var(--faint);
  margin-top:3px;
}

/* Blocks. The frame never changes - scope line, headline, verdict, signature -
   and up to three of these stack between the verdict and the foot. The label
   reuses the signature's mono register so it reads as a label rather than a
   second headline; the padding and rule are reset because h2 is styled for the
   landing page. Two labelled bullet blocks are what a comparison is. */
.block + .block{margin-top:28px}
/* v2: a block can hold more than one kind of line now */
.block > :not(.bl) + :not(.bl){margin-top:22px}
.bl{
  font-family:var(--mono);
  font-size:11px;
  font-weight:400;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 13px;
  padding-top:0;
  border-top:0;
}

/* metadata sits at the bottom like a signature, not a footer bar */
.meta{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--faint);
}
.meta .sig{display:flex;flex-direction:column;gap:5px;min-width:0}
/* One line, whatever the model is called: the actions sit beside it, so a
   name long enough to wrap would push them out of the row. */
.meta .r1{
  line-height:1.5;
  white-space:nowrap;
  overflow:hidden;        /* also contains the floated mark */
  text-overflow:ellipsis;
}
.meta .r2{color:var(--faint)}
/* same mark, scaled to the signature's smaller type */
.meta .logo{width:10px;height:8px;margin:2px 7px 0 0}
.meta .sep{opacity:.5}
.meta .model{color:var(--dim);margin-left:6px}
.meta .by{color:var(--faint)}

footer{
  margin-top:14px;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--faint);
}
footer .frow{display:none}
/* same hairline-to-accent treatment as the share control */
a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--hair)}
a:hover{color:var(--accent);border-bottom-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
footer .how{text-transform:none;letter-spacing:0;font-size:12px;line-height:1.5;text-wrap:pretty}
.cmd{color:var(--accent)}

/* The actions sit on the signature line so they read as part of the card
   rather than a toolbar bolted under it. They must stay SHORTER than the
   signature beside them: the renderer draws .r1 and .r2 and never sees these
   buttons, so any height they add here is height the share image does not
   have. Two icons are 46px, which is also what lets the model line keep the
   rest of the row - the same pair as text labels needed 176px and truncated
   anything longer than "GPT-5". */
.wrap{display:flex;flex-direction:column;align-items:center;width:100%}
.acts{display:flex;gap:6px;flex:none;align-self:flex-start;margin:-6px}
.act{
  display:block;
  width:30px;
  height:30px;
  padding:7px;           /* a 16px glyph in a 30px tap target, and the */
  color:var(--dim);      /* negative margin on .acts keeps the row at 16 */
  background:transparent;
  border:0;
  cursor:pointer;
  flex:none;
}
.act svg{display:block;width:16px;height:16px}
.act:hover{color:var(--accent)}
.act:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-radius:4px}
.act[disabled]{opacity:.45;cursor:default}
/* the confirmation: the glyph itself becomes the tick, in accent */
.act.done{color:var(--accent)}
/* announced rather than drawn - the icon carries the message for everyone who
   can see it, and this carries it for everyone who cannot */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

</style>
</head>
<body>
<!-- ONE shell, used by both the landing page and a rendered card. Only the
     contents of .head / main / .foot are ever replaced - the structure and
     its layout mode never change, so the browser lays out one kind of
     document per load instead of two. -->
<div class="wrap"><div class="sheet" id="sheet">

  <div class="head" id="head">
    <div class="brand">
      <svg class="logo" viewBox="0 0 12 10" aria-hidden="true">
        <rect x="0" y="0" width="12" height="2" rx="1"/>
        <rect x="0" y="4" width="7" height="2" rx="1"/>
        <circle cx="1.5" cy="8.5" r="1.5"/>
      </svg>
      <span>upshot.fyi</span>
    </div>
  </div>

  <!-- Empty on purpose. This document has one job: render whatever is in the
       fragment. It ships no copy of its own, so it is never a tall page that
       shrinks after layout - which is what the landing page used to make every
       card link do. -->
  <main id="main"></main>
  <noscript><p style="padding:0 26px;color:#B4B6C2">An export is drawn in your
    browser from the link itself, so this page needs JavaScript.</p></noscript>

  <div class="foot" id="foot">
    <footer><div class="how">Made by <a href="https://github.com/midnight-merge">Midnight
      Merge</a></div></footer>
  </div>

</div>

</div>

<script>
/* Decode once, which is what a percent-encoded string means.

   This used to decode repeatedly until the result stopped changing, to repair
   a link a model had encoded twice. It was written when the Encoding section
   was a list of characters to remember and getting it wrong was common; the
   rule is now one sentence and a batch of real generations came back clean, so
   the repair was defending a hole that has since been filled in.

   It was not free. Decoding until nothing changes cannot tell a double-encoded
   comma from text that simply contains one: a card explaining that "%2C means
   comma" had to write %252C, and got back a comma. Text that is about the
   encoding is exactly the text a format like this attracts. */
function decodeOnce(v){
  try { return decodeURIComponent(v); } catch(e){ return v; }
}

/* The card is a fixed frame - scope line, headline, verdict, signature - with
   up to three blocks stacked in the middle. g= starts a block and labels it;
   the key that follows decides what kind. Blocks come out in the order they
   appear in the URL, so the grammar needs no numbering and no nesting. */
var BLOCK_KEYS = ['p', 'o', 'c', 'f', 'r', 't', 'i', 's'];

/* Keys whose value is several fields with a colon between them. They are the
   only ones that travel with a written colon still disguised - see MARK. */
var FIELDED = ['f', 'i', 'r', 't', 'c', 's', 'u'];

/* A colon is the field separator and is also an ordinary character in English.
   Decoding %3A on the way in would make the two the same thing, which is why a
   written colon used to survive in a bullet and silently cut an r= label short.
   So it comes in disguised, is split around, and is a colon again on the far
   side. Nothing outside this file ever sees the stand-in: fields() and text()
   take it back out, and esc() does too, so it cannot reach the page even by a
   route nobody thought of. */
var MARK = '\u0001';
function text(s){
  return String(s == null ? '' : s).split(MARK).join(':');
}

/* The one place that knows what a field is. It was six places, each deriving
   the grammar again from a split() - which is how %3A came to work in some of
   them and quietly truncate in others. n is how many fields the key has, and
   the last one keeps whatever is left, so trailing prose may hold colons.

   That last part is now the grammar's central law rather than a convenience:
   every key puts its machine fields first and its one human field last. A
   name, a number, a formula and a condition all have restricted character
   sets and cannot be ambiguous; wording can hold anything, and is safe
   precisely because nothing follows it. So a raw colon in a label is no
   longer a silent mis-split - "Be there by 9:30" splits and rejoins intact,
   encoded or not. Where a field is optional it is still present and may be
   empty, because an empty leading field costs one character and an empty one
   removes a heuristic.

   f= is the one exception, and stays Label:Value. It is the only key with
   TWO human fields - "Licence: MIT", "Cold start: 180ms", "Runtime: Node 20"
   - so the law cannot protect both, and reordering it only moves the exposure
   from the label onto the value. The value is the field more likely to carry
   a colon, being a time, a ratio or a version, while an f= label is a short
   noun phrase. So the value keeps the protected slot it already had. The law
   holds wherever there is exactly one human field, which is every other key
   in the language.

   Deliberately does not trim. A label wants trimming and the caller does it;
   a formula must not be touched, because parse() has already turned its plus
   signs into spaces and a trailing one is a + that has to come back. Trimming
   here turned the malformed "1+" into a confident 1. */
function fields(item, n){
  var parts = String(item == null ? '' : item).split(':');
  var out = parts.slice(0, n - 1);
  out.push(parts.slice(n - 1).join(':'));
  while(out.length < n) out.push('');
  return out.map(text);
}

/* What the card refuses to draw.

   These were all silent before, and silence is the failure this format exists
   to avoid: a duplicate name drew a live-looking control that no formula read,
   and an input whose start value was not a number computed as zero. Both
   rendered perfectly and were wrong, with nothing for a reader to notice.

   A dash is for a question that cannot be answered. This is different - the
   card itself does not make sense, so there is nothing to draw and no honest
   way to draw part of it. */
var RESERVED = {ticks: 1, boxes: 1, pi: 1};

function audit(out){
  var claimed = {};

  function claim(name, what){
    if(!name) return;
    if(Object.prototype.hasOwnProperty.call(RESERVED, name)){
      out.problems.push('"' + name + '" is a reserved name and cannot be ' + what);
      return;
    }
    if(Object.prototype.hasOwnProperty.call(claimed, name)){
      out.problems.push('the name "' + name + '" is claimed twice');
      return;
    }
    claimed[name] = what;
  }

  out.blocks.forEach(function(b){
    b.items.forEach(function(item){
      if(b.type === 'i'){
        var f = fields(item, 3);
        claim(f[0].trim(), 'an input');
        // a start value that is not a number used to compute as zero
        var start = f[1].trim();
        if(start === '' || !isFinite(parseFloat(start)) ||
           !/^-?[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?$/.test(start))
          out.problems.push('the input "' + f[2].trim() + '" starts at "' +
                            start + '", which is not a number');
      }
      if(b.type === 'c') claim(checkField(item).name, 'a box');
      if(b.type === 'r') claim(fields(item, 3)[0].trim(), 'a result');
    });
  });

  /* A pick-one is the exception, and the only one: its rows SHARE a name on
     purpose, because that is what makes them one group. So the group is what
     claims the name, not each option. */
  var groups = {};
  out.blocks.forEach(function(b){
    if(b.type !== 's') return;
    b.items.forEach(function(item){ groups[fields(item, 3)[0].trim()] = 1; });
  });
  for(var g in groups) if(Object.prototype.hasOwnProperty.call(groups, g)) claim(g, 'a pick-one');

  // a unit for a name nothing declares is a typo, and a silent one
  for(var u in out.units){
    if(!Object.prototype.hasOwnProperty.call(out.units, u)) continue;
    if(!Object.prototype.hasOwnProperty.call(claimed, u))
      out.problems.push('a unit is declared for "' + u + '", which nothing on the card names');
  }
}

function parse(hash){
  var out = {blocks: [], units: {}, problems: []};
  var current = null;
  var pendingLabel = null;
  var group = -1;

  /* g=Freedom+r=Raw+runway arrives as one label reading "Freedom r=Raw
     runway", and every formula downstream of the lost key dies with it. Only
     a label is repaired - it is 1 to 4 words, so a literal + directly in
     front of a key is unambiguous there in a way it is not inside a
     sentence. */
  var pairs = [];
  hash.replace(/^#/,'').split('&').forEach(function(pair){
    if(/^g=/.test(pair)){
      var bits = pair.split(/\+(?=[gpocfirs]=)/);
      if(bits.length > 1){ pairs = pairs.concat(bits); return; }
    }
    pairs.push(pair);
  });

  pairs.forEach(function(pair){
    if(!pair) return;
    var i = pair.indexOf('=');
    if(i < 0) return;
    var k = pair.slice(0,i);
    var v = decodeOnce(pair.slice(i+1).replace(/\+/g,' ').replace(/%3A/gi, MARK));
    // only a fielded key needs the disguise kept; everything else is prose and
    // wants its colon back before anyone reads it
    if(FIELDED.indexOf(k) < 0) v = text(v);

    if(k === 'g'){
      // v2: a g= is the ONLY thing that starts a block, so one block can hold
      // whatever mix of lines it needs - inputs and the results that use them
      // are one thing on the card and now one thing in the grammar
      pendingLabel = v;
      current = null;
      group++;
      return;
    }
    if(k === 'u'){
      // u=name:unit. Declared once; twice is a contradiction, not a rebinding.
      var uf = fields(v, 2);
      var un = uf[0].trim(), uu = uf[1].trim();
      if(!un) return;
      if(Object.prototype.hasOwnProperty.call(out.units, un))
        out.problems.push('the unit for "' + un + '" is declared twice');
      else out.units[un] = uu;
      return;
    }
    if(BLOCK_KEYS.indexOf(k) >= 0){
      if(group < 0) group = 0;          // lines before any g= are block one
      if(!current || current.type !== k){
        current = {type: k, label: pendingLabel, group: group, items: []};
        pendingLabel = null;
        out.blocks.push(current);
      }
      current.items.push(v);
      return;
    }
    out[k] = v;
  });

  out.blocks = out.blocks.filter(function(b){ return b.items.length; });
  audit(out);
  /* There was a cap of three blocks here, and it truncated - a fourth block
     vanished with no dash and nothing in /broken/, so a card labelled
     IMPORTANT disappeared in test. It measured the wrong thing anyway: three
     blocks of five long bullets is far taller than six f= rows, so block
     count barely tracks height. Length is capped where it is real, at 2000
     characters of URL, and the frame comes first, so the verdict is above the
     fold however many blocks follow. Two or three is now shape shown in the
     examples rather than a rule enforced by a slice. */
  // worked out here rather than while drawing, so every reader of a parsed
  // card - the renderer, the share image, copy for AI - sees the same numbers
  computeAll(out.blocks, out.w, out.k, out.x, out.units);
  return out;
}

function esc(t){
  return text(t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// the mark, same geometry as the homepage's - see .logo
var LOGO = '<svg class="logo" viewBox="0 0 12 10" aria-hidden="true">' +
  '<rect x="0" y="0" width="12" height="2" rx="1"/>' +
  '<rect x="0" y="4" width="7" height="2" rx="1"/>' +
  '<circle cx="1.5" cy="8.5" r="1.5"/></svg>';

/* One 16px grid, stroked in currentColor, so an icon inherits the link
   treatment the rest of the card uses and needs no colour of its own. The
   tick and the cross are the same size as what they replace, so confirming an
   action can never move the row. */
var ICON = (function(){
  var open = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
    'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" ' +
    'aria-hidden="true">';
  return {
    copy:  open + '<path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.5"/>' +
                  '<rect x="5.5" y="5.5" width="9" height="9" rx="1.5"/></svg>',
    share: open + '<path d="M8 10.5V2"/><path d="M5 5l3-3 3 3"/>' +
                  '<path d="M3.5 8.5v4A1.5 1.5 0 0 0 5 14h6a1.5 1.5 0 0 0 1.5-1.5v-4"/></svg>',
    done:  open + '<path d="M3 8.5l3.5 3.5L13 4.5"/></svg>',
    fail:  open + '<path d="M4.5 4.5l7 7"/><path d="M11.5 4.5l-7 7"/></svg>'
  };
})();

/* An icon says what a button does and nothing about what just happened, so
   every action ends by swapping the glyph for a tick or a cross and saying the
   same thing into the live region for anyone not looking at it. Same 16px box
   either way, so the signature row never moves. */
function actionResult(btn, ok, said){
  clearTimeout(btn._revert);
  // captured on first use, so the resting glyph is whatever the markup put
  // there rather than something a caller has to remember to hand over
  if(!btn._icon) btn._icon = btn.innerHTML;
  btn.innerHTML = ok ? ICON.done : ICON.fail;
  btn.classList.toggle('done', ok);
  var live = document.getElementById('said');
  if(live) live.textContent = said;
  btn._revert = setTimeout(function(){
    btn.innerHTML = btn._icon;
    btn.classList.remove('done');
    if(live) live.textContent = '';
  }, 2200);
}

/* The credit line and the Copy button are the same gesture - take this to an
   AI - so one sentence explains both: what the button is for, then how you get
   a card of your own. The instruction has to survive on its own in the share
   image, where there is no button to explain. */
var CREDIT = '<footer><div class="how">Paste it into any AI to dig in. Or make ' +
  'your own - tell yours to <span class="cmd">read https://upshot.fyi</span> and ' +
  'export this</div></footer>';

/* ---- blocks ----
   A block owns one stretch of the middle and nothing else, and declares one
   thing: the HTML for its items. v1 made each declare a second implementation
   in canvas ops for the share image, and the two had to be kept in agreement;
   the image is gone and so is that tax. */

/* ---- expressions ----
   A card can work a number out instead of being told one. What the URL
   carries is a formula, never code: this is a tokeniser and a
   recursive-descent parser over a closed set of operators and named
   functions, so a link can compute and cannot execute. eval() or Function()
   here would hand any stranger's URL the run of the page, on a domain whose
   whole value is that people trust what it opens.

   Everything that goes wrong - unknown name, bad syntax, divide by zero -
   comes back as null and draws as a dash. A number that is not a number must
   never reach the card looking like one. */
/* A unit attached to a name, declared once with u=name:unit.

   Every numeric card used to smuggle its units into a label - "Interest rate
   percent" - and print its answers bare, so "Payment 222" never said of
   what. An ambiguous number is not a cosmetic problem.

   Two fields rather than three, and the unit last. An earlier draft had u=
   carrying a display label too, for a t= that was to be grouped by name; t=
   groups by its label instead, so nothing needed the binding and the field
   went.

   A unit does one of two jobs. Most decorate: the number is untouched and the
   unit is printed beside it, which has to be free text because shipped cards
   already carry ms and kb and no closed list would hold them. A few reformat,
   and those are a closed list, because changing how a number reads is not
   something to infer from free text. */
var MONEY = {'£':1, '$':1, '€':1, '¥':1};
var CLOCK = {hr: 60, min: 60};

/* 5.64 hours is 5:38, and printing 5.64 was the oldest soft spot in the
   format. The fraction is the part that needs converting, and it rounds, so
   59.6 minutes reads 1:00 rather than 0:60. */
function inUnit(value, unit){
  if(!Object.prototype.hasOwnProperty.call(CLOCK, unit)) return null;
  if(value === null || !isFinite(value) || value < 0) return null;
  var whole = Math.floor(value);
  var part = Math.round((value - whole) * CLOCK[unit]);
  if(part === CLOCK[unit]){ whole++; part = 0; }
  return whole + ':' + (part < 10 ? '0' : '') + part;
}

/* The number as the card prints it, wearing whatever unit its name declared.
   Money leads, because that is how money is written; everything else trails. */
function withUnit(value, unit){
  var shown = showNumber(value);
  if(!unit || value === null) return shown;
  var clock = inUnit(value, unit);
  if(clock !== null) return clock;
  return Object.prototype.hasOwnProperty.call(MONEY, unit)
    ? unit + shown : shown + unit;
}

/* pi only, and deliberately not e.

   e was here for one afternoon. Then the corpus was rescored and two real
   generations broke on it: a model had used e as the name for energy, which
   is what e is for in any physics card anyone would write. Reserving a single
   common letter to save writing exp(1) is a bad trade, and the corpus said so
   before any of this shipped. Nobody names a variable pi. */
var CONSTS = {pi: Math.PI};

var FUNCS = {
  min: Math.min, max: Math.max, abs: Math.abs, sqrt: Math.sqrt,
  pow: Math.pow, floor: Math.floor, ceil: Math.ceil,
  /* Natural log, and named ln rather than log on purpose: Math.log is base e,
     a spreadsheet's LOG is base 10, and a model that guesses wrong gets a
     plausible number rather than an error. ln means one thing everywhere.
     It is what turns a rate into a how-long - months to clear a balance,
     years to double - which nothing else here could express. */
  ln: Math.log,
  /* The inverse ln never had, which is why compound growth was unreachable:
     ln could say how long something takes but nothing could say what it grows
     to. A rate compounded n times is exp(n*ln(1+r)), and without exp the
     whole geometric half of the language was missing. */
  exp: Math.exp,
  round: function(x, dp){
    var f = Math.pow(10, dp || 0);
    return Math.round(x * f) / f;
  }
};

function tokenize(src){
  var out = [], i = 0;
  while(i < src.length){
    var ch = src.charAt(i);
    if(ch === ' '){ i++; continue; }
    if(ch >= '0' && ch <= '9' || ch === '.'){
      var num = /^[0-9]*\.?[0-9]+/.exec(src.slice(i));
      if(!num) throw 0;
      out.push({t: 'num', v: parseFloat(num[0])});
      i += num[0].length;
      continue;
    }
    if(/[A-Za-z_]/.test(ch)){
      var word = /^[A-Za-z_][A-Za-z0-9_]*/.exec(src.slice(i))[0];
      out.push({t: 'name', v: word});
      i += word.length;
      continue;
    }
    var two = src.substr(i, 2);
    if(two === '<=' || two === '>=' || two === '==' || two === '!='){
      out.push({t: two});
      i += 2;
      continue;
    }
    if('+-*/(),<>?:'.indexOf(ch) >= 0){ out.push({t: ch}); i++; continue; }
    throw 0;
  }
  return out;
}

function parseExpr(tokens){
  var pos = 0;
  var peek = function(){ return tokens[pos] || {t: 'end'}; };
  var eat = function(t){
    if(peek().t !== t) throw 0;
    return tokens[pos++];
  };

  function ternary(){
    var cond = comparison();
    if(peek().t !== '?') return cond;
    eat('?');
    var yes = ternary();
    eat(':');
    return {op: '?', c: cond, a: yes, b: ternary()};
  }
  var CMP = {'<':1, '>':1, '<=':1, '>=':1, '==':1, '!=':1};
  /* A chain means what it means in English and in maths, not what it means in
     C: 18<=age<65 is both comparisons, not (18<=age) compared to 65. It used
     to draw a dash - honest, but a model writes this, so honest was not
     enough.

     The middle operand is shared between the two halves, which is the whole
     point of a chain and the reason this cannot just be a loop over
     additive(). */
  function comparison(){
    var left = additive();
    if(!CMP[peek().t]) return left;
    var op = tokens[pos++].t;
    var mid = additive();
    var node = {op: op, l: left, r: mid};
    while(CMP[peek().t]){
      var next = tokens[pos++].t;
      var right = additive();
      node = {op: 'and', l: node, r: {op: next, l: mid, r: right}};
      mid = right;
    }
    return node;
  }
  function additive(){
    var left = multiplicative();
    while(peek().t === '+' || peek().t === '-'){
      left = {op: tokens[pos++].t, l: left, r: multiplicative()};
    }
    return left;
  }
  function multiplicative(){
    var left = unary();
    while(peek().t === '*' || peek().t === '/'){
      left = {op: tokens[pos++].t, l: left, r: unary()};
    }
    return left;
  }
  /* A leading + means nothing, which is what lets "+5" and "2*+3" through:
     both are arithmetic a model can reasonably write, and neither is worth
     failing a card over. */
  function unary(){
    if(peek().t === '-'){ pos++; return {op: 'neg', l: unary()}; }
    if(peek().t === '+'){ pos++; return unary(); }
    return primary();
  }
  function primary(){
    var tk = peek();
    if(tk.t === 'num'){ pos++; return {op: 'num', v: tk.v}; }
    if(tk.t === '('){ pos++; var inner = ternary(); eat(')'); return inner; }
    if(tk.t === 'name'){
      pos++;
      if(peek().t !== '(') return {op: 'ref', v: tk.v};
      eat('(');
      var args = [];
      if(peek().t !== ')'){
        args.push(ternary());
        while(peek().t === ','){ pos++; args.push(ternary()); }
      }
      eat(')');
      return {op: 'call', v: tk.v, args: args};
    }
    throw 0;
  }

  var tree = ternary();
  if(pos !== tokens.length) throw 0;   // trailing junk is a broken formula
  return tree;
}

/* own-property lookups only, on both sides: a name in a URL must not be able
   to reach constructor, __proto__ or anything else the prototype chain would
   otherwise answer for */
function evalNode(node, env){
  switch(node.op){
    case 'num': return node.v;
    case 'ref':
      /* pi is a constant rather than a function, so it is a name with no
         brackets. A card cannot claim it - see the refusals - so looking here
         first can never shadow something the author wrote. */
      if(Object.prototype.hasOwnProperty.call(CONSTS, node.v)) return CONSTS[node.v];
      if(!Object.prototype.hasOwnProperty.call(env, node.v)) throw 0;
      return env[node.v];
    case 'neg': return -evalNode(node.l, env);
    case 'call':
      if(!Object.prototype.hasOwnProperty.call(FUNCS, node.v)) throw 0;
      return FUNCS[node.v].apply(null, node.args.map(function(a){
        return evalNode(a, env);
      }));
    case '?': return evalNode(node.c, env) ? evalNode(node.a, env)
                                           : evalNode(node.b, env);
  }
  var l = evalNode(node.l, env), r = evalNode(node.r, env);
  switch(node.op){
    case '+':  return l + r;
    case '-':  return l - r;
    case '*':  return l * r;
    case '/':  return l / r;
    case '<':  return l <  r ? 1 : 0;
    case '>':  return l >  r ? 1 : 0;
    case '<=': return l <= r ? 1 : 0;
    case '>=': return l >= r ? 1 : 0;
    case '==': return l === r ? 1 : 0;
    case '!=': return l !== r ? 1 : 0;
    // only ever built by a chained comparison, so both sides are already 1 or 0
    case 'and': return (l && r) ? 1 : 0;
  }
  throw 0;
}

function evaluate(src, env){
  try {
    var v = evalNode(parseExpr(tokenize(src)), env);
    return typeof v === 'number' && isFinite(v) ? v : null;
  } catch(e){ return null; }
}

/* Deterministic rather than toLocaleString: the sender and the receiver must
   read the same figure, and a number grouped to the viewer's locale would not
   be the number that was sent. Two decimals at most, trailing zeros trimmed -
   round() in the formula is how a card asks for none. */
/* Two places is right for money and for most answers a card carries. It is
   wrong for a number whose whole magnitude sits below them: a capacitance of
   0.000001 printed as 0 turns correct working into 1/sqrt(0.01*0), a proof
   that refutes itself, and a rate of 0.002 becomes a headline figure reading
   nothing. Below a hundredth, show three significant figures instead - which
   is the smallest change that keeps a small number honest. */
function twoPlaces(v){
  var a = Math.abs(v);
  /* Six figures, not three, for a number whose whole magnitude sits below two
     decimal places - a physical constant entered as 0.000000000066743 shown
     as 0 is not a small number, it is a wrong one. The printed working has
     its own rule now; see plainNumber. */
  if(a !== 0 && a < 0.01) return String(Number(v.toPrecision(6)));
  return v.toFixed(2).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
}

function showNumber(v){
  if(v === null) return '\u2014';
  var s = twoPlaces(v);
  var sign = s.charAt(0) === '-' ? '-' : '';
  if(sign) s = s.slice(1);
  var dot = s.indexOf('.');
  var whole = dot < 0 ? s : s.slice(0, dot);
  return sign + whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',') +
         (dot < 0 ? '' : s.slice(dot));
}

/* A number as the printed WORKING cites it, which is a different job from
   showNumber and now formats differently.

   showNumber presents: two places is right for money and for most answers a
   reader wants to read. plainNumber proves, and a proof that does not
   reproduce the answer is worse than no proof at all - it refutes itself in
   front of the reader.

   Found 15 Sep 2026, by looking at a card rather than by a test. A compound
   growth step held 1.9991314 and the working printed round(14000*2), which
   recomputes to 28,000 under an answer reading 27,988. The card was right and
   its own working said otherwise.

   twoPlaces already carried half this fix - below a hundredth it switches to
   six significant figures, with a comment about exactly this - but the hole
   above a hundredth stayed open until `exp` went in and made multipliers like
   1.9991314 an ordinary thing for a card to hold.

   Six figures, which is the number twoPlaces already reached for below a
   hundredth and for the same reason - enough for anything a card really
   carries, short enough to still read as a number. One precision for all
   working rather than two rules meeting at 0.01. A condition gets it too: a
   runway of 8.999 against a target of 9 printed as 9>=9 reads true beside a
   verdict saying otherwise, which is the same proof refuting itself. */
var plainNumber = function(v){
  if(v === null) return '\u2014';
  if(v === 0) return '0';
  return String(Number(v.toPrecision(6)));
};

/* Inputs are read before anything is worked out, so a formula can name one
   wherever it sits on the card - a result above its own inputs still resolves.
   Results stay strictly ordered among themselves, which is what keeps a cycle
   impossible; an input is a leaf and can never make one.

   One w= carries every input on the card, in document order, exactly as one k=
   carries every tick. What the reader typed wins over what the sender sent,
   which is what makes the link theirs once they have touched it. */
function readInputs(blocks, written, env, units){
  units = units || {};
  var typed = String(written == null ? '' : written).split('~');
  env = env || {};
  var seen = 0;
  blocks.forEach(function(b){
    if(b.type !== 'i') return;
    b.fields = b.items.map(function(item){
      // name:Start:Label. The label is last so it can hold a colon; the name
      // and the start value are both machine fields and cannot.
      var f = fields(item, 3);
      var name = f[0].trim(), sent = f[1].trim(), label = f[2].trim();
      var mine = typed[seen++];
      var value = parseFloat(mine !== undefined && mine !== '' ? mine : sent);
      if(!isFinite(value)) value = 0;
      // The first claim on a name wins, everywhere on the card - a later i=,
      // c= or r= reusing one is a mistake, not a rebinding, so it is dropped
      // rather than silently rewiring every formula that already reads it.
      if(name && !Object.prototype.hasOwnProperty.call(env, name)) env[name] = value;
      return {name: name, label: label, value: value,
              unit: Object.prototype.hasOwnProperty.call(units, name) ? units[name] : ''};
    });
  });
  return env;
}

/* Results are worked out in document order, and each one joins the
   environment the next can see - so a formula too long to read on one line
   breaks into named steps instead. A result may only name results defined
   above it, which makes a cycle impossible rather than something to detect. */
/* c=Label or c=Label:name. A trailing single word after a colon is a name;
   anything with a space in it is still part of the label, which is what keeps
   "Bring ID: passport" prose and "Be there by 9:30" a time. */
function checkField(item){
  /* name:Wording, and the name comes first so the wording is last and safe.
     It used to be a bare word after the last colon, which is a heuristic and
     behaved like one: "Bring one thing:passport" lost the passport, while
     "Bring ID: passport" survived purely because of the space. An unnamed box
     writes the field empty - c=:You have a mortgage - which costs a character
     and removes the guess. */
  var f = fields(item, 2);
  return {name: f[0].trim(), label: f[1].trim()};
}

/* The checklist, as numbers a formula can use. One k= covers every
   checklist on the card in document order, so the count runs across blocks
   exactly as the ticks do.

   Seeded AFTER the inputs, so an input that happens to be called `ticks`
   cannot quietly redefine what the spec says the word means. */
/* Pick-one, as the number a formula reads.

   Lines sharing a name are one group - a repeated key rather than a separator
   or a nested list, which is the same bargain every other key makes. The name
   does not resolve to WHICH option is chosen; it resolves to the chosen
   option's value, which is the whole point. A tax band's threshold stops being
   four multiplied-out terms and becomes one number that changes.

   Groups run card-wide and in document order, so one x= covers all of them the
   way one k= covers every checklist. The first option is chosen until the
   reader says otherwise: a card has to be good before anyone touches it, and a
   group defaulting to nothing would land every formula below it on a dash. */
function readPicks(blocks, chosen, env, units){
  units = units || {};
  var picked = String(chosen == null ? '' : chosen).split('~');
  var order = [], byName = {};
  blocks.forEach(function(b){
    if(b.type !== 's') return;
    b.options = b.items.map(function(item){
      // name:Value:Label - an i= with the reader's choice in place of a box
      var f = fields(item, 3);
      var value = parseFloat(f[1].trim());
      if(!isFinite(value)) value = 0;
      var name = f[0].trim();
      if(!Object.prototype.hasOwnProperty.call(byName, name)){
        byName[name] = {name: name, index: order.length, options: []};
        order.push(byName[name]);
      }
      var g = byName[name];
      var opt = {label: f[2].trim(), value: value, name: name,
                 unit: Object.prototype.hasOwnProperty.call(units, name) ? units[name] : '',
                 group: g.index, slot: g.options.length, on: 0};
      g.options.push(opt);
      return opt;
    });
  });
  order.forEach(function(g){
    var at = parseInt(picked[g.index], 10);
    if(!isFinite(at) || at < 0 || at >= g.options.length) at = 0;
    g.chosen = at;
    g.options.forEach(function(o, i){ o.on = i === at ? 1 : 0; });
    // First claim on a name wins here too - an i= or an earlier group holding
    // this name is not rebound, the same way a duplicate input is dropped.
    if(g.name && !Object.prototype.hasOwnProperty.call(env, g.name)){
      env[g.name] = g.options[at] ? g.options[at].value : 0;
    }
  });
  return order;
}

/* The checklist, as numbers a formula can use.

   One k= still covers every box on the card in document order - that is the
   reader's state and it has to stay one string - but the COUNTS are scoped to
   the block. Card-wide was never a decision, it was the absence of one, and
   it was silently wrong: two checklists on one card shared a single count, so
   a score written for the first list counted the second as well. The formula
   read correctly and the number was wrong, which is the worst failure this
   format has.

   A block with no checklist in it does not get ticks and boxes at all, rather
   than getting zero. Zero would make ticks/boxes a nonsense 0/0 and, worse,
   would answer a question the card cannot answer. An absent name draws a
   dash, which is what a formula asking about a list that is not there
   deserves.

   Named boxes stay card-wide, because a name is explicit - naming the boxes
   is how a card scores across two lists now that counting cannot. */
function readTicks(blocks, ticked){
  var marks = String(ticked == null ? '' : ticked);
  var names = {}, seen = 0, byGroup = {};
  blocks.forEach(function(b){
    if(b.type !== 'c') return;
    if(!Object.prototype.hasOwnProperty.call(byGroup, b.group))
      byGroup[b.group] = {ticks: 0, boxes: 0};
    var scope = byGroup[b.group];
    b.items.forEach(function(item){
      var on = marks.charAt(seen++) === '1' ? 1 : 0;
      var name = checkField(item).name;
      if(name) names[name] = on;
      scope.ticks += on;
      scope.boxes++;
    });
  });
  return {byGroup: byGroup, names: names};
}

/* The names a formula in this block can see: the card's, plus whatever the
   block's own checklist means by ticks and boxes. */
function scopedEnv(env, group, counted){
  var scope = counted.byGroup[group];
  if(!scope) return env;
  var out = Object.create(null);
  for(var k in env) if(Object.prototype.hasOwnProperty.call(env, k)) out[k] = env[k];
  out.ticks = scope.ticks;
  out.boxes = scope.boxes;
  return out;
}

/* Restoring the + that parse() turned into a space.

   A formula is allowed to be written with ordinary spacing, so putting every
   space back as a + is wrong - "(1 + 2) * 3" would become "(1+2)+*+3". A space
   touching a real operator was never a plus, so those go first; whatever is
   left sits between two operands, which is the one place a + went missing.

   Brackets are the exception, and are why this is a function rather than one
   more chained replace. They are not operators: a gap inside a bracket is
   spacing - "( a + b )" - but a gap against the outside of one is an operand
   boundary, so "a+(b)" and "round(a)+round(b)" arrive as "a (b)" and
   "round(a) round(b)" and the plus has to come back. The only real ambiguity
   is a name before "(", which is a call if the name is one of ours and a lost
   plus if it is not - and we hold the list, so it is not a guess. */
function restorePlus(src){
  return String(src == null ? '' : src)
    .replace(/\s+/g, ' ')
    .replace(/ *([-+*\/,<>=?:!]) */g, '$1')
    .replace(/\( /g, '(')
    .replace(/ \)/g, ')')
    .replace(/([A-Za-z_][A-Za-z0-9_]*) \(/g, function(all, word){
      return Object.prototype.hasOwnProperty.call(FUNCS, word) ? word + '(' : word + '+(';
    })
    .replace(/([0-9)]) \(/g, '$1+(')
    .replace(/\) /g, ')+')
    .replace(/ /g, '+');
}

/* The printed working, with every name replaced by what it held. A name is
   the one thing in a formula a reader cannot check, so showing the algebra
   instead of the numbers would make the working decorative. One owner,
   because it was two identical regexes in t= and r=. */
function substitute(expr, env){
  return String(expr).replace(/[A-Za-z_][A-Za-z0-9_]*/g, function(word){
    return Object.prototype.hasOwnProperty.call(env, word)
      ? plainNumber(env[word]) : word;
  });
}

function computeAll(blocks, written, ticked, chosen, units){
  units = units || {};
  var counted = readTicks(blocks, ticked);
  // ticks and boxes are scoped to a block rather than to the card, so they
  // are layered on per row by scopedEnv rather than seeded here
  var env = Object.create(null);
  readInputs(blocks, written, env, units);
  // after the inputs, so an i= holding the same name keeps it - and before the
  // named boxes, for no reason beyond document order being the tie-break
  readPicks(blocks, chosen, env, units);
  for(var name in counted.names){
    if(Object.prototype.hasOwnProperty.call(counted.names, name) &&
       !Object.prototype.hasOwnProperty.call(env, name)) env[name] = counted.names[name];
  }
  /* Results resolve by need, not by document order.

     They used to run top to bottom, each joining the pool the next could see,
     so a formula that cited a step written below it drew a dash. That is a
     wall with nothing behind it: writing the headline number first and its
     workings underneath is how people write, and the card punished it. Order
     now carries no meaning at all - the only thing that cannot be resolved is
     a genuine loop, and a loop draws a dash, which is the honest answer.

     Names are claimed in document order even though evaluation is not, so
     which row owns a duplicated name stays deterministic. First claim wins,
     exactly as it does for an input. */
  var rows = [];
  blocks.forEach(function(b){
    if(b.type !== 'r') return;
    b.computed = b.items.map(function(item){
      var f = fields(item, 3);
      var row = {name: f[0].trim(), expr: restorePlus(f[1]), label: f[2].trim(),
                 group: b.group, value: null, done: false};
      row.unit = Object.prototype.hasOwnProperty.call(units, row.name)
        ? units[row.name] : '';
      rows.push(row);
      return row;
    });
  });

  // claim names first, in document order, so a duplicate is dropped rather
  // than silently rewiring every formula that already reads the name
  var pending = {};
  rows.forEach(function(row){
    if(row.name && !Object.prototype.hasOwnProperty.call(env, row.name)
       && !Object.prototype.hasOwnProperty.call(pending, row.name)){
      pending[row.name] = row;
    } else {
      row.name = '';
    }
  });

  /* A row is ready when nothing it cites is still waiting to be worked out.
     A name that is never defined anywhere is not waiting - it is absent, and
     evaluate() already draws a dash for it, so it must not block the row
     forever or a typo would look like a cycle. */
  function ready(row){
    var words = row.expr.match(/[A-Za-z_][A-Za-z0-9_]*/g) || [];
    for(var i = 0; i < words.length; i++){
      if(words[i] === row.name) continue;
      if(Object.prototype.hasOwnProperty.call(pending, words[i])) return false;
    }
    return true;
  }

  function settle(row){
    var seen = scopedEnv(env, row.group, counted);
    row.done = true;
    row.value = row.expr ? evaluate(row.expr, seen) : null;

    /* The formula is printed so the number can be checked, and a name is the
       one thing in it a reader cannot check - a step with no label is not on
       the card at all, so "s*18" cites something invisible. Substituted
       before this row joins env, so a row can never cite itself. */
    row.expr = substitute(row.expr, seen);

    // a row that just cites a step restates its own number - "59700" under
    // 59,700 is noise, not working
    if(row.expr === plainNumber(row.value)) row.expr = '';

    if(row.name){
      delete pending[row.name];
      if(row.value !== null) env[row.name] = row.value;
    }
  }

  for(var moved = true; moved; ){
    moved = false;
    rows.forEach(function(row){
      if(row.done || !ready(row)) return;
      settle(row);
      moved = true;
    });
  }

  // whatever is left cites something that cites it back. Settling them drops
  // them out of pending so the working still prints, and the dash is real.
  rows.forEach(function(row){ if(!row.done){ delete pending[row.name]; } });
  rows.forEach(function(row){ if(!row.done) settle(row); });

  /* Decisions last, and all of them, so a condition may cite any result on
     the card rather than only the ones above it. */
  blocks.forEach(function(b){
    if(b.type !== 't') return;
    /* A cascade. Rows sharing a label are one decision, the first true
       condition wins, and a row with an empty condition is the fallback.

       It used to be four positional fields - Label:Condition:Yes:No - which
       made it both the most fragile key to parse and the only one that could
       not say what people actually mean by a threshold. Under / about right /
       over is three outcomes, and a live generation that wanted three found
       none, chained a second condition into the false slot, and printed
       "c>=40:Snacks may stabilise the situation:Suspiciously reasonable" at a
       reader. A rule that forbids without offering an alternative gets
       broken.

       Three fields puts the WORDING last, so the most fragile key in the
       language becomes one of the safest. Binary is two rows. Outcomes are
       uncapped. The grouping rule is the one s= already uses, and it is what
       the model reached for unprompted when it hit the wall.

       The label leads, and is the one field here not protected from a raw
       colon - the same trade f= makes, and for the same reason: a label is a
       short noun phrase while wording is a sentence, so the sentence gets the
       safe slot. */
      var order = [], byLabel = {};
      b.items.forEach(function(item){
        var f = fields(item, 3);
        var label = f[0].trim();
        if(!Object.prototype.hasOwnProperty.call(byLabel, label)){
          byLabel[label] = {label: label, rows: []};
          order.push(byLabel[label]);
        }
        byLabel[label].rows.push({cond: restorePlus(f[1]), text: f[2].trim()});
      });

      var seen = scopedEnv(env, b.group, counted);
      b.decided = order.map(function(g){
        var dash = {label: g.label, expr: '', text: ''};
        /* What a fallback shows as its working. A row that wins is its own
           proof - the condition is true, so that is why this wording. A
           fallback wins because every condition failed, so the failed ones
           ARE the proof, and printing nothing would hand the reader a verdict
           with nothing behind it. For a two-row decision this comes to the
           single condition the old four-field key used to print, which is
           what it should be. */
        var failed = [];

        /* A fallback that is not last makes every row after it unreachable.
           That is malformed rather than merely unanswerable, and guessing
           which row was meant to win is the kind of repair this format
           refuses. */
        for(var j = 0; j < g.rows.length - 1; j++) if(!g.rows[j].cond) return dash;

        for(var i = 0; i < g.rows.length; i++){
          var row = g.rows[i];

          // the fallback, which can only be last by the check above
          if(!row.cond)
            return {label: g.label, expr: failed.join(', '), text: row.text};

          /* A decision is a comparison by definition. A bare number here is
             not a quiet decision, it is fields that came apart at a colon
             nobody encoded - a label or a piece of wording spilling into the
             comparator's slot. Truthy-coercing it would pick a real-looking
             branch with false authority. */
          if(!/<=|>=|==|!=|<|>/.test(row.cond)) return dash;

          var hit = evaluate(row.cond, seen);

          /* null is "could not be worked out", not "false", and the whole
             decision dashes rather than falling through to the next row.
             Falling through would treat unknown as false and print a later
             outcome with full authority - "Stay home. The numbers have
             spoken." - when nothing spoke: the condition cited a result that
             was itself a dash. */
          if(hit === null) return {label: g.label, expr: substitute(row.cond, seen), text: ''};
          if(hit) return {label: g.label, expr: substitute(row.cond, seen), text: row.text};
          failed.push(substitute(row.cond, seen));
        }

        // every condition was false and the author wrote no fallback
        return dash;
      });

  });
}

const listHTML = (cls, items, row) =>
  '<ul class="' + cls + '">' + items.map(row).join('') + '</ul>';

/* Which rows each of these actually draws. bindInputs() repaints them in
   place without redrawing the card, so it has to select exactly the rows the
   body put there - two lists that drifted apart is the bug this stops. */
const computedRows = block => (block.computed || []).filter(c => c.label);
const decidedRows  = block => (block.decided  || []).filter(c => c.label);

const BLOCKS = {
  p: {
    body: items => listHTML('points', items, pt =>
      '<li><span class="n">&bull;</span><span>' + esc(pt) + '</span></li>'),

  },

  o: {
    // the digit lives in the markup, not a CSS counter, because the share
    // renderer has to be able to read it
    body: items => '<ol class="steps">' + items.map((step, i) =>
      '<li><span class="n">' + (i + 1) + '</span><span>' + esc(step) + '</span></li>'
    ).join('') + '</ol>',

  },

  c: {
    /* A real <input type=checkbox> in a <label>: focusable, tappable along the
       whole row, and a checkbox to a screen reader. A ticked row goes quiet
       rather than struck through, so the renderer reproduces the state for
       free by reading each row's own computed colour. */
    body: (items, ticked) => listHTML('checks', items, (item, i) =>
      '<li><label><input type="checkbox"' +
      (String(ticked || '')[i] === '1' ? ' checked' : '') +
      '><span>' + esc(checkField(item).label) + '</span></label></li>'),

  },

  f: {
    // Label:Value - the one row key. n= is gone: it was this drawn large with
    // its two fields the other way round, which is a look, not a meaning.
    body(items, _, block){
      /* One or two rows are the point of the block, so they get headline
         treatment - but only when they ARE the block. Beside bullets or a
         result, a row set at 34px is not a figure, it is a row shouting. */
      if(items.length <= 2 && block && block.alone) return BLOCKS.n.body(items);
      return '<div class="facts">' + items.map(row => {
        const [key, value] = fields(row, 2);
        return '<div class="fact"><span class="fk">' + esc(key) + '</span>' +
               (value ? '<span class="fv">' + esc(value) + '</span>' : '') + '</div>';
      }).join('') + '</div>';
    }
  },

  n: {
    // no longer a key the model writes - just how f draws when there are one
    // or two of it. Label:Value, the f= exception to the wording-last law.
    body(items){
      return '<div class="stats">' + items.map(row => {
        const [label, value] = fields(row, 2);
        return '<div class="stat"><div class="sv">' + esc(value) + '</div>' +
               (label ? '<div class="sl">' + esc(label) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    },

  },

  s: {
    /* A real <input type=radio>, grouped by the name the options share - so
       exclusivity is the browser's job and a screen reader calls it what it
       is. Drawn round against the checklist's square for the same reason the
       key exists: one-of and any-of are different questions, not two looks. */
    body(items, _, block){
      const options = block.options || [];
      if(!options.length) return '';
      return listHTML('picks', options, o =>
        '<li><label><input type="radio" name="pick' + o.group + '"' +
        (o.on ? ' checked' : '') +
        ' data-group="' + o.group + '" data-slot="' + o.slot + '">' +
        '<span>' + esc(o.label) +
        (o.unit ? '<span class="iu">' + esc(withUnit(o.value, o.unit)) + '</span>' : '') +
        '</span></label></li>');
    }
  },

  i: {
    /* Name~Label~Default. A real number input, so a phone raises the number
       keypad and a screen reader calls it what the label calls it. */
    body(items, _, block){
      const fields = block.fields || [];
      if(!fields.length) return '';
      /* The unit rides on the label rather than beside the box. A number
         input cannot hold a £, and a third column would shift the label
         column by however wide the unit happened to be, which is the
         alignment the fixed-width box exists to protect.

         This is the same place the model used to smuggle its units into -
         "Interest rate percent" - and it reads the same, which is the point:
         what changed is that it is now declared once as data instead. The
         card decides how to draw it, and the same declaration also puts £ on
         the result and turns 5.64 into 5:38. */
      return listHTML('ins', fields, f =>
        '<li><label><input type="number" inputmode="decimal" step="any" ' +
        'value="' + esc(f.value) + '"><span>' + esc(f.label) +
        (f.unit ? '<span class="iu">' + esc(f.unit) + '</span>' : '') +
        '</span></label></li>'
      );
    },

    /* The box is a fixed width the CSS declares, so the label wraps against a
       column the renderer can be told about rather than one it has to watch -
       which is the same bargain the checklist makes with its 16px tick. */
  },

  t: {
    /* The same row as f and r - given, worked out, decided. A reader sees one
       kind of line whichever way the card arrived at it. */
    body(items, _, block){
      const rows = decidedRows(block);
      if(!rows.length) return '';
      return '<div class="facts calc" data-rows="t">' + rows.map(c =>
        '<div class="fact"><span class="fk">' + esc(c.label) + '</span>' +
        '<span class="fv">' + esc(c.text || '\u2014') + '</span>' +
        (c.expr ? '<span class="fx">' + esc(c.expr) + '</span>' : '') +
        '</div>'
      ).join('') + '</div>';
    }
  },

  r: {
    /* Name~Label~Formula, and the same row as f, because a result is a fact
       the card worked out. A row with an empty label is a named step - it
       exists for the formulas below it and is not drawn, which is what keeps
       a long calculation from arriving as one unreadable line. */
    body(items, _, block){
      const rows = computedRows(block);
      if(!rows.length) return '';
      return '<div class="facts calc" data-rows="r">' + rows.map(c =>
        '<div class="fact"><span class="fk">' + esc(c.label) + '</span>' +
        '<span class="fv">' + esc(withUnit(c.value, c.unit)) + '</span>' +
        (c.expr ? '<span class="fx">' + esc(c.expr) + '</span>' : '') +
        '</div>'
      ).join('') + '</div>';
    }
  }
};

// own-property lookup only: block keys come from the URL
const blockKind = type =>
  Object.prototype.hasOwnProperty.call(BLOCKS, type) ? BLOCKS[type] : null;

// returns the contents of the three regions - never the regions themselves
function render(d){
  /* head: the mark on top, exactly as the homepage has it, and the sender's
     scope line beneath. The mark used to be left off here - a card is the
     sender's content, not our branding - but iOS Chrome eats the top ~90px of
     every page it opens from another app (example.com and Wikipedia's own
     articles included, so this is not ours to fix). Something has to live in
     that strip. Branding survives being clipped; the scope line does not. */
  /* The mark is sacrificial, and re-confirmed as such on 11 Sep 2026: with it
     removed, a card opened from WhatsApp on iOS arrives with the scope line
     already up behind the browser chrome. Nothing on screen says there is
     anything above, so the reader does not know to scroll - a silent loss of
     the line that frames the whole card. Branding survives being clipped.
     The scope line does not. */
  var head = '<a class="brand mark" href="/">' + LOGO + '<span>upshot.fyi</span></a>';
  if(d.a){
    head += '<div class="brand scope"><span>' + esc(d.a) + '</span></div>';
  }

  var main = '';
  if(d.h) main += '<h1>' + esc(d.h) + '</h1>';
  if(d.v) main += '<p class="verdict">' + esc(d.v) + '</p>';
  var groups = [];
  d.blocks.forEach(function(b){
    var g = groups[groups.length - 1];
    if(!g || g.group !== b.group){
      g = {group: b.group, label: b.label, runs: []};
      groups.push(g);
    } else if(!g.label && b.label){ g.label = b.label; }
    g.runs.push(b);
  });
  // a run that shares its block with others cannot claim the block's whole
  // register - see f below, which is the only one that wanted to
  groups.forEach(function(g){
    g.runs.forEach(function(b){ b.alone = g.runs.length === 1; });
  });
  main += groups.map(function(g){
    // a block that drew nothing is left out entirely rather than left as an
    // empty section - a heading with no body under it reads as a bug
    var inner = g.runs.map(function(b){
      var kind = blockKind(b.type);
      return kind ? kind.body(b.items, d.k, b) : '';
    }).join('');
    if(!inner) return '';
    return '<section class="block">' +
      (g.label ? '<h2 class="bl">' + esc(g.label) + '</h2>' : '') +
      inner +
    '</section>';
  }).join('');

  /* the date row is omitted rather than left empty: the column gap applies
     between flex items whatever their size, so an empty one still costs 5px
     the renderer, which skips a blank date, does not draw */
  var date = (d.d || '').trim();
  var foot = '<div class="meta">' +
    '<div class="sig">' +
      '<div class="r1">' + LOGO +
        '<span class="by">Generated by</span>' +
        '<span class="model">' + esc(d.m || 'Unknown model') + '</span></div>' +
      (date ? '<div class="r2">' + esc(date) + '</div>' : '') +
    '</div>' +
    '<div class="acts">' +
      '<button type="button" class="act" id="copyBtn" ' +
        'title="Copy for AI" aria-label="Copy for AI">' + ICON.copy + '</button>' +
      '<button type="button" class="act" id="shareBtn" ' +
        'title="Share link" aria-label="Share link">' + ICON.share + '</button>' +

    '</div>' +
    '<p class="sr" id="said" role="status" aria-live="polite"></p>' +
    '</div>' + CREDIT;

  return {head: head, main: main, foot: foot};
}

/* ---- copy for AI ----
   The card as plain text, for pasting into a chat. Nothing leaves the browser
   here - it goes to the clipboard, and where it lands after that is the
   viewer's business, which is what keeps the privacy claim on / true.

   Markers are the ones you would type by hand rather than markdown, so the
   structure survives in a chat box that renders nothing. The provenance goes
   at the FOOT: a model reads the content first and is told what it is second,
   which is the right way round for "is this true?". */
function copyText(d){
  var parts = [];
  if(d.h) parts.push(d.h);
  if(d.v) parts.push(d.v);

  // one k= covers every checklist on the card, in document order - so the tick
  // cursor runs across blocks, not within one
  var tick = 0;
  d.blocks.forEach(function(b){
    var lines = b.label ? [b.label.toUpperCase()] : [];

    /* A result copies with its formula attached. Someone whose first reaction
       is "is that right?" is pasting this into their own model, and the
       arithmetic is the part worth checking. */
    if(b.type === 'i'){
      (b.fields || []).forEach(function(f){
        lines.push(f.label + ': ' + showNumber(f.value));
      });
      if(lines.length) parts.push(lines.join('\n'));
      return;
    }

    if(b.type === 's'){
      (b.options || []).forEach(function(o){
        lines.push('(' + (o.on ? 'x' : ' ') + ') ' + o.label);
      });
      if(lines.length) parts.push(lines.join('\n'));
      return;
    }

    if(b.type === 't'){
      (b.decided || []).forEach(function(c){
        if(c.label && c.text) lines.push(c.label + ': ' + c.text +
                                         (c.expr ? '  = ' + c.expr : ''));
      });
      if(lines.length) parts.push(lines.join('\n'));
      return;
    }

    if(b.type === 'r'){
      (b.computed || []).forEach(function(c){
        if(c.label) lines.push(c.label + ': ' + showNumber(c.value) +
                               (c.expr ? '  = ' + c.expr : ''));
      });
      if(lines.length) parts.push(lines.join('\n'));
      return;
    }

    b.items.forEach(function(item, i){
      if(b.type === 'o')      lines.push((i + 1) + '. ' + text(item));
      else if(b.type === 'c') lines.push('[' + (String(d.k || '')[tick++] === '1' ? 'x' : ' ') + '] ' + checkField(item).label);
      else if(b.type === 'f'){
        var row = fields(item, 2);
        lines.push(row[0] + (row[1] ? ': ' + row[1] : ''));
      }
      else                    lines.push('- ' + text(item));
    });
    parts.push(lines.join('\n'));
  });

  var from = 'Generated by ' + (d.m || 'an unnamed model') + (d.d ? ' on ' + d.d : '');
  parts.push('---\n' + from +
    (d.a ? '\nThe ask: ' + d.a : '') +
    '\nShared as an upshot: ' + location.href);

  return parts.join('\n\n');
}

/* execCommand is the fallback, not the relic: the clipboard API needs a secure
   context, and a card opened from a file:// path or plain http has none. */
function toClipboard(text){
  if(navigator.clipboard?.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    // off-screen but still selectable, and no scroll jump on focus
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);   // select() alone is a no-op on iOS
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('copy refused'));
  });
}

function bindCopy(){
  var btn = document.getElementById('copyBtn');
  if(!btn) return;
  btn.addEventListener('click', function(){
    // read the link at click time, not at draw time: typing and ticking
    // rewrite the fragment without redrawing, so a captured card goes stale
    toClipboard(copyText(parse(location.hash))).then(function(){
      actionResult(btn, true, 'Copied. Paste it into any AI');
    }, function(){
      actionResult(btn, false, 'Could not copy');
    });
  });
}

/* ---- share the link ----
   The link IS the export, so there is nothing to render and nothing to
   deliver - navigator.share hands the URL to the same sheet the image used
   to open. Desktop has no sheet worth the name, so it copies instead. */
function bindShare(){
  var btn = document.getElementById('shareBtn');
  if(!btn) return;
  btn.addEventListener('click', function(){
    var url = location.href;
    if(navigator.share){
      navigator.share({url: url}).then(function(){
        actionResult(btn, true, 'Shared');
      }, function(e){
        // dismissing the sheet is a decision, not a failure
        if(e && e.name !== 'AbortError') actionResult(btn, false, 'Could not share');
      });
      return;
    }
    toClipboard(url).then(function(){
      actionResult(btn, true, 'Link copied');
    }, function(){
      actionResult(btn, false, 'Could not copy the link');
    });
  });
}

/* Repaint the worked-out rows in place from the link. Not a redraw: that
   would take the focus out of the box being typed in, and the tick out from
   under the finger.

   Re-read rather than recompute from the DOM, so the numbers on the card and
   the numbers in the link cannot disagree - the link is the state, and this is
   just what it looks like. */
function repaintFromLink(){
  var d = parse(location.hash);
  var computed = [], decided = [];
  d.blocks.forEach(function(b){
    if(b.type === 'r') computed = computed.concat(computedRows(b));
    if(b.type === 't') decided  = decided.concat(decidedRows(b));
  });
  paintRows('[data-rows="r"] .fact', computed, function(c){ return withUnit(c.value, c.unit); });
  paintRows('[data-rows="t"] .fact', decided,  function(c){ return c.text || '\u2014'; });
}

/* The rows a body drew never change in number, only in what they say - which
   is what lets this walk them in step with the parsed card. */
function paintRows(sel, rows, value){
  [].slice.call(document.querySelectorAll(sel)).forEach(function(node, i){
    var c = rows[i];
    if(!c) return;
    node.querySelector('.fv').textContent = value(c);
    var fx = node.querySelector('.fx');
    if(fx) fx.textContent = c.expr;
  });
}

/* Ticks rewrite the fragment, so a viewer who works through a list ends up
   holding a link to their own version and can pass it on. replaceState rather
   than assignment: it leaves the back button alone and fires no hashchange, so
   this cannot loop back into draw(). One k= covers every checklist on the
   card, in document order. */
function bindChecks(){
  var boxes = [].slice.call(document.querySelectorAll('.checks input'));
  if(!boxes.length) return;
  boxes.forEach(function(box){
    box.addEventListener('change', function(){
      writeFragment('k', boxes.map(function(b){
        return b.checked ? '1' : '0';
      }).join(''));
      // ticks and boxes are in scope for every formula on the card
      repaintFromLink();
    });
  });
}

/* Typing rewrites the fragment and the results together, so the reader ends
   up holding a link to their own version of the card - the same bargain the
   checklist makes, except what accumulates is their numbers rather than their
   ticks. That is the whole reason the formula lives in the URL instead of the
   answer: a sender's card becomes the reader's card without either of them
   sending anything anywhere.

   The card is never redrawn, only written into. Redrawing would take the
   focus out of the field mid-keystroke, and replaceState leaves the back
   button alone and fires no hashchange, so this cannot loop back into draw(). */
function writeFragment(key, value){
  var frag = location.hash.replace(/^#/, '');
  var re = new RegExp('(^|&)' + key + '=[^&]*');
  history.replaceState(null, '',
    '#' + (re.test(frag) ? frag.replace(re, '$1' + key + '=' + value)
                         : frag + '&' + key + '=' + value));
}

/* Choosing rewrites the fragment the way a tick does. The browser already
   enforces one-of within a radio name, so this only has to record which slot
   won in each group - one x=, groups in document order, same as k=. */
function bindPicks(){
  var radios = [].slice.call(document.querySelectorAll('.picks input'));
  if(!radios.length) return;
  radios.forEach(function(radio){
    radio.addEventListener('change', function(){
      var choice = [];
      radios.forEach(function(r){
        var g = parseInt(r.getAttribute('data-group'), 10);
        if(r.checked && isFinite(g)) choice[g] = r.getAttribute('data-slot');
      });
      for(var i = 0; i < choice.length; i++){
        if(choice[i] === undefined) choice[i] = '0';
      }
      writeFragment('x', choice.join('~'));
      // the chosen value is in scope for every formula on the card
      repaintFromLink();
    });
  });
}

function bindInputs(){
  var boxes = [].slice.call(document.querySelectorAll('.ins input'));
  if(!boxes.length) return;

  boxes.forEach(function(box){
    box.addEventListener('input', function(){
      writeFragment('w', boxes.map(function(b){
        // a field cleared to nothing is a zero, not a hole: the alternative is
        // every formula below it going to a dash while someone retypes a digit
        var v = parseFloat(b.value);
        return isFinite(v) ? v : 0;
      }).join('~'));

      repaintFromLink();
    });
  });
}

if('scrollRestoration' in history){ history.scrollRestoration = 'manual'; }

/* ---- embedded ----
   The homepage shows a real card as its demo rather than a picture of one, in
   a frame pointed at a real /v2/ link. Same origin, so the card can size its
   own frame - which is the only way the height can be right, since it depends
   on how the card's text wraps at whatever width the frame ended up.

   It lives here rather than on the landing page on purpose: that document is
   what a model fetches to learn the format, and carries exactly one script - a
   redirect - so the spec can never come to depend on JS running. Embedding is
   the card's business anyway.

   frameElement throws on a cross-origin parent, which is the answer either
   way: not our frame, not our business. */
function asEmbed(){
  var frame;
  try{ frame = window.frameElement; }catch(e){ return; }
  if(!frame) return;

  document.documentElement.className += ' embed';

  var fit = function(){
    frame.style.height = document.documentElement.scrollHeight + 'px';
  };
  // the card rewrites itself as the reader types, and a recomputed row can
  // take a line it did not before - follow the height rather than guess once
  if(window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
  document.addEventListener('input', fit);
  fit();
}

/* What a refused card says. The scope line survives because it is the one
   part of a malformed card that is still trustworthy - it is plain wording
   and nothing computed from it - so the reader at least learns what they were
   sent. Everything below it is replaced by the reason. */
function refusalHead(d){
  var head = '<a class="brand mark" href="/">' + LOGO + '<span>upshot.fyi</span></a>';
  if(d.a) head += '<div class="brand scope"><span>' + esc(d.a) + '</span></div>';
  return head;
}

function refusalMain(d){
  return '<h1>This card could not be drawn</h1>' +
    '<p class="verdict">The link arrived whole, but the card it describes ' +
    'does not make sense, so nothing was drawn rather than something that ' +
    'looked right and was not.</p>' +
    '<section class="block">' +
    listHTML('points', d.problems, function(why){
      return '<li><span class="n">&bull;</span><span>' + esc(why) + '</span></li>';
    }) +
    '</section>' +
    '<p class="verdict">Ask the AI that wrote it to export this again.</p>';
}

function draw(){
  var d = parse(location.hash);
  // Nothing renderable in the link - no headline, no verdict, no blocks. That
  // is its own page, not a card that says it is not a card: this document only
  // ever draws exports, and /broken/ only ever explains a bad link.
  if(!d.h && !d.v && !d.blocks.length){ location.replace('../broken/'); return; }

  /* A card that does not make sense is not drawn at all. Drawing part of it
     is what the old behaviour did - a duplicate name became a dead control, a
     non-numeric start became zero - and both looked right.

     It says so here rather than at /broken/, which is for a link with nothing
     in it and stays static HTML on purpose: it is the page that has to work
     when everything else has not. This link arrived whole and parsed, so
     sending its reader off to look for a truncation would point them at a
     problem that is not there. The card explains itself instead, and keeps
     the frame, so whoever was sent it can still see what it was meant to be
     about. */
  if(d.problems && d.problems.length){
    document.title = 'upshot';
    document.getElementById('head').innerHTML = refusalHead(d);
    document.getElementById('main').innerHTML = refusalMain(d);
    document.getElementById('foot').innerHTML = render({m: d.m, d: d.d, blocks: []}).foot;
    window.scrollTo(0, 0);
    return;
  }
  var r = render(d);
  /* The tab, and what a browser hands over when you copy the link with its
     title. The og: tags cannot carry the headline - a crawler never sees the
     fragment - but this side of the link can, and the bare page title is the
     one place a reader on the card meets "export" instead of the point. */
  document.title = d.h || d.v || 'upshot';
  // fill the existing regions; the shell itself is never rebuilt, so the
  // layout does not change shape mid-load
  document.getElementById('head').innerHTML = r.head;
  document.getElementById('main').innerHTML = r.main;
  document.getElementById('foot').innerHTML = r.foot;
  bindShare();
  bindCopy();
  bindChecks();
  bindPicks();
  bindInputs();
  window.scrollTo(0, 0);
}



draw();
asEmbed();
window.addEventListener('hashchange', draw);

</script>
</body>
</html>
