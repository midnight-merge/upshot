<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Chat</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap">
  <style>
    :root {
      --bg: #f5f4f1;
      --surface: #ffffff;
      --surface-2: #edecea;
      --text: #1c1b18;
      --text-muted: #7a756f;
      --accent: #1d4ed8;
      --accent-subtle: #dbeafe;
      --accent-text: #1e3a8a;
      --border: #e6e2db;
      --badge-chatgpt: #10a37f;
      --badge-claude: #d97449;
      --badge-gemini: #4285f4;
      --badge-unknown: #7a756f;
      --radius: 6px;
      --font-display: 'Newsreader', Georgia, serif;
      --font-ui: 'DM Sans', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111110;
        --surface: #1a1918;
        --surface-2: #232220;
        --text: #f0ece5;
        --text-muted: #8a847e;
        --accent: #5b8df7;
        --accent-subtle: #1e3058;
        --accent-text: #93b4fb;
        --border: #2c2a27;
        --badge-chatgpt: #34d399;
        --badge-claude: #fb923c;
        --badge-gemini: #7baaf7;
        --badge-unknown: #8a847e;
      }
    }

    :root[data-theme="dark"] {
      --bg: #111110;
      --surface: #1a1918;
      --surface-2: #232220;
      --text: #f0ece5;
      --text-muted: #8a847e;
      --accent: #5b8df7;
      --accent-subtle: #1e3058;
      --accent-text: #93b4fb;
      --border: #2c2a27;
      --badge-chatgpt: #34d399;
      --badge-claude: #fb923c;
      --badge-gemini: #7baaf7;
      --badge-unknown: #8a847e;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
    }

    .nav-brand {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
    }

    .nav-actions { display: flex; align-items: center; gap: 8px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      transition: border-color 0.15s, color 0.15s;
      text-decoration: none;
    }

    .btn:hover { color: var(--text); border-color: var(--text-muted); }

    .main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 24px 120px;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }

    .source-badge.chatgpt { background: var(--badge-chatgpt); }
    .source-badge.claude  { background: var(--badge-claude); }
    .source-badge.gemini  { background: var(--badge-gemini); }
    .source-badge.unknown { background: var(--badge-unknown); }

    .meta-dot { opacity: 0.35; }

    .title {
      font-family: var(--font-display);
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0 0 40px;
      color: var(--text);
      text-wrap: balance;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .topics-section { margin-bottom: 48px; }

    .topic-timeline {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .topic-chip {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .topic-chip.last {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .topic-arrow {
      color: var(--border);
      font-size: 14px;
      flex-shrink: 0;
      user-select: none;
    }

    .summary-section { margin-bottom: 44px; }

    .summary-text {
      font-family: var(--font-display);
      font-size: 17px;
      line-height: 1.75;
      color: var(--text);
      max-width: 66ch;
    }

    .summary-text p { margin: 0 0 1.2em; }
    .summary-text p:last-child { margin-bottom: 0; }

    .takeaways-section { margin-bottom: 56px; }

    .takeaways-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .takeaway-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 14px;
      color: var(--text);
      line-height: 1.55;
    }

    .takeaway-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      margin-top: 6px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 48px 0;
    }

    .transcript-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.15s;
    }

    .transcript-toggle:hover { color: var(--text); }

    .toggle-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .transcript-toggle[aria-expanded="true"] .toggle-icon { transform: rotate(180deg); }

    .transcript-body {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
    }

    .transcript-body[hidden] { display: none; }

    .message {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 0 16px;
      align-items: start;
    }

    .message:last-child { border-bottom: none; }

    .msg-role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-top: 3px;
      text-align: right;
    }

    .msg-role.user { color: var(--text-muted); }
    .msg-role.assistant { color: var(--accent); }

    .msg-content {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .truncation-note {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--accent-subtle);
      color: var(--accent-text);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .error-state {
      text-align: center;
      padding: 80px 24px;
    }

    .error-icon { font-size: 40px; margin-bottom: 20px; opacity: 0.4; }

    .error-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 10px;
      color: var(--text);
    }

    .error-desc {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 42ch;
      margin: 0 auto;
      line-height: 1.6;
    }

    .copy-feedback {
      font-size: 12px;
      color: var(--badge-chatgpt);
      opacity: 0;
      transition: opacity 0.2s;
      font-weight: 500;
    }

    .copy-feedback.show { opacity: 1; }

    .demo-notice {
      padding: 8px 14px;
      background: var(--accent-subtle);
      color: var(--accent-text);
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .demo-notice a { color: inherit; font-weight: 600; }

    @media (max-width: 560px) {
      .main { padding: 36px 16px 80px; }
      .nav { padding: 0 16px; }
      .message { grid-template-columns: 56px 1fr; }
    }

    @media print {
      .nav, .transcript-toggle { display: none; }
      .transcript-body[hidden] { display: flex !important; }
      .main { padding: 20px 0; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="index.html">Export Chat</a>
  <div class="nav-actions">
    <span class="copy-feedback" id="copyFeedback">Copied!</span>
    <button class="btn" onclick="copyUrl()">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="5" width="9" height="9" rx="1.5"/>
        <path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/>
      </svg>
      Copy link
    </button>
    <button class="btn" onclick="window.print()">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6V2h8v4M4 12H2.5A1.5 1.5 0 011 10.5v-3A1.5 1.5 0 012.5 6h11A1.5 1.5 0 0115 7.5v3A1.5 1.5 0 0113.5 12H12M4 10h8v4H4v-4z"/>
      </svg>
      Print
    </button>
  </div>
</nav>

<main class="main" id="app">
  <p style="color:var(--text-muted);font-size:13px">Loading…</p>
</main>

<script>
  var DEMO = {
    title: "Building a bookmarklet to export AI conversations",
    source: "chatgpt",
    timestamp: "2026-09-03T14:22:00Z",
    summary: "The conversation explored the design and implementation of a browser bookmarklet that lets users export and summarise conversations from AI tools like ChatGPT, Claude, and Gemini. The central idea was to avoid any backend: all exported data is compressed and embedded directly in the URL fragment, making each export link self-contained and permanent.\n\nA key architectural decision was storing only the AI-generated summary in the URL by default, keeping link lengths manageable. LZ-string compression was discussed as a way to fit larger payloads while remaining well within browser URL limits.\n\nThe conversation concluded with a phased delivery plan: starting with ChatGPT support in an MVP, then adding Claude.ai and Gemini selectors, and finally handling very long conversations through graceful truncation.",
    topics: [
      { name: "Tool concept", description: "Establishing the core idea of a URL-encoded conversation exporter." },
      { name: "Bookmarklet UX", description: "How users install and trigger the bookmarklet on any AI tool page." },
      { name: "URL encoding", description: "Encoding conversation data into the URL hash with compression." },
      { name: "DOM extraction", description: "Site-specific selectors for reading messages from ChatGPT, Claude, and Gemini." }
    ],
    lastTopic: "DOM extraction",
    keyTakeaways: [
      "No backend needed — all data lives in the URL fragment, which never expires.",
      "LZ-string compression lets you fit a full summary and short transcripts into shareable URLs.",
      "Site-specific DOM selectors are the most maintenance-intensive part of the implementation.",
      "The OpenAI API call returns structured JSON with topics, summary, and takeaways in one pass."
    ],
    messages: [
      { role: "user", content: "I want to build a tool that helps users summarise and export a conversation they have had with an AI tool. The summary will be handled as a web page where the URL stores the data." },
      { role: "assistant", content: "Great idea. The URL-hash approach means no backend is needed — the data lives in the fragment and is never sent to a server. Here's how it works: the bookmarklet extracts your conversation, calls an LLM to summarise it, then compresses and base64-encodes the result into the URL fragment of a static viewer page." },
      { role: "user", content: "How does the user trigger the bookmarklet while on ChatGPT?" },
      { role: "assistant", content: "They click a bookmark in their browser's bookmarks bar. A bookmarklet is a bookmark whose href is JavaScript instead of a URL — when clicked, it runs that code in the context of the current page, giving it access to the DOM to read the conversation." }
    ],
    truncated: false
  };

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) { return ''; }
  }

  function sourceName(src) {
    return { chatgpt: 'ChatGPT', claude: 'Claude', gemini: 'Gemini' }[src] || 'AI';
  }

  function decode(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  function loadData() {
    var hash = location.hash;
    if (!hash || hash.indexOf('#data=') !== 0) return DEMO;
    try {
      return JSON.parse(decode(hash.slice(6)));
    } catch (e) { return null; }
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function render(data) {
    if (!data) {
      document.getElementById('app').innerHTML =
        '<div class="error-state">' +
        '<div class="error-icon">⚠️</div>' +
        '<p class="error-title">Couldn\'t decode this link</p>' +
        '<p class="error-desc">The URL may be incomplete or corrupted. Ask for the original link to be shared again.</p>' +
        '</div>';
      return;
    }

    var isDemo = data === DEMO;

    var topicHtml = (data.topics || []).map(function (t, i) {
      var isLast = t.name === data.lastTopic;
      var chip = '<span class="topic-chip' + (isLast ? ' last' : '') + '" title="' + esc(t.description) + '">' + esc(t.name) + (isLast ? ' ★' : '') + '</span>';
      var arrow = i < data.topics.length - 1 ? '<span class="topic-arrow">→</span>' : '';
      return chip + arrow;
    }).join('');

    var takeawaysHtml = (data.keyTakeaways || []).map(function (t) {
      return '<li class="takeaway-item"><span class="takeaway-dot"></span><span>' + esc(t) + '</span></li>';
    }).join('');

    var summaryHtml = (data.summary || '').split('\n\n').filter(Boolean).map(function (p) {
      return '<p>' + esc(p) + '</p>';
    }).join('');

    var msgsHtml = (data.messages || []).map(function (m) {
      return '<div class="message">' +
        '<span class="msg-role ' + esc(m.role) + '">' + (m.role === 'user' ? 'You' : esc(sourceName(data.source))) + '</span>' +
        '<div class="msg-content">' + esc(m.content) + '</div>' +
        '</div>';
    }).join('');

    var truncNote = data.truncated
      ? '<div class="truncation-note">ℹ️ Conversation was trimmed to fit URL limits — earlier messages may be missing.</div>'
      : '';

    var demoNotice = isDemo
      ? '<div class="demo-notice">ℹ️ This is a demo. <a href="index.html">Get the bookmarklet</a> to export a real conversation.</div>'
      : '';

    document.getElementById('app').innerHTML =
      demoNotice +
      '<div class="meta">' +
        '<span class="source-badge ' + esc(data.source) + '">' + esc(sourceName(data.source)) + '</span>' +
        '<span class="meta-dot">·</span>' +
        '<span>' + esc(formatDate(data.timestamp)) + '</span>' +
      '</div>' +
      '<h1 class="title">' + esc(data.title || 'Untitled conversation') + '</h1>' +
      '<section class="topics-section">' +
        '<p class="section-label">Topics covered</p>' +
        '<div class="topic-timeline">' + topicHtml + '</div>' +
      '</section>' +
      '<section class="summary-section">' +
        '<p class="section-label">Summary</p>' +
        '<div class="summary-text">' + summaryHtml + '</div>' +
      '</section>' +
      '<section class="takeaways-section">' +
        '<p class="section-label">Key takeaways</p>' +
        '<ul class="takeaways-list">' + takeawaysHtml + '</ul>' +
      '</section>' +
      '<div class="divider"></div>' +
      '<div>' + truncNote +
        '<button class="transcript-toggle" id="transcriptToggle" aria-expanded="false" onclick="toggleTranscript()">' +
          '<span class="toggle-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="2,3 5,7 8,3"/></svg></span>' +
          'View full conversation (' + (data.messages || []).length + ' messages)' +
        '</button>' +
        '<div class="transcript-body" id="transcriptBody" hidden>' + msgsHtml + '</div>' +
      '</div>';
  }

  function toggleTranscript() {
    var btn = document.getElementById('transcriptToggle');
    var body = document.getElementById('transcriptBody');
    var open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', open ? 'false' : 'true');
    body.hidden = open;
  }

  function copyUrl() {
    navigator.clipboard.writeText(location.href).then(function () {
      var fb = document.getElementById('copyFeedback');
      fb.classList.add('show');
      setTimeout(function () { fb.classList.remove('show'); }, 2000);
    });
  }

  render(loadData());
</script>

</body>
</html>
